# PATH: config/coverage_intent_scroll.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (Scroll)
#
# CHAIN QUALITY STATUS (2026-03-14 R27):
#   Classification: ECOSYSTEM_BLOCKED / monitoring_only
#   Evidence: long_scan R26 - 0/3 PASS, 0 signals, accepted-fail
#   DEXes: nuri_v3 (uniswap_v3/quoter_v2) + sushiswap_v3 (uniswap_v3/quoter_v2)
#   NOTE: dexes.yaml declares nuri_v3 as adapter_type=uniswap_v3/quoter_v2
#         (verified getPool(a,a,fee) UniV3-style on scrollscan.build)
#         Previous coverage config incorrectly excluded nuri_v3 as "algebra-incompatible".
#         R27 fix: re-enabled nuri_v3 to align with trust anchor (dexes.yaml).
#   Status: FAIL (expected). Cross-DEX now possible but not yet verified online.
#   BLOCKED_BY: Thin liquidity, ecosystem maturity. Online verification pending.
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline on Scroll.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_scroll.yaml --cycles 1
#
# R27: Re-enabled nuri_v3 — dexes.yaml says uniswap_v3/quoter_v2 (trust anchor)
# v3.2.56: Previously removed nuri_v3 (incorrectly classified as algebra)
# v3.2.20: Initial config for Scroll multi-chain rollout

# Chain: Scroll
chain: scroll
chain_id: 534352

# RPC endpoints with fallback
rpc_endpoints:
  - "https://rpc.scroll.io"
  - "https://scroll.public.blastapi.io"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
# v3.2.17: Enables factory.getPool() discovery via resolve_runtime_pairs()
universe_source: discovery_runtime

# DEXes to scan (must have factory addresses in dexes.yaml)
# R27: nuri_v3 re-enabled — dexes.yaml declares adapter_type=uniswap_v3/quoter_v2
# Cross-DEX arbitrage now possible: nuri_v3 <-> sushiswap_v3
dexes:
  - sushiswap_v3
  - nuri_v3

# Discovery settings
discovery_runtime_max_pairs: 20
# R27: require_cross_dex=true — now 2 DEXes available (nuri_v3 + sushiswap_v3)
require_cross_dex: true

# Multicall batching (default ON)
use_multicall: true

# v3.2.37: Use QuoterV2 for executable pricing
use_quoter_v2: true

# USD-notional sizing (M4.2)
use_usd_notional: true
target_usd_notional: 100.0

# Spread economics
# v3.2.50: min_spread_bps lowered from 5 to 3 for better signal capture
# Rationale: Scroll gas_usd_estimate=0.05 means 3bps spread is still profitable
min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.05  # Scroll is relatively cheap

# v3.2.62: Relaxed SUSPECT_LIQUIDITY thresholds for Scroll
# Scroll pools report high gas_estimate (2M+) and many ticks_crossed (30+)
# This appears to be due to thin liquidity on this newer chain
# Raising thresholds to allow signal production for coverage assessment
quoter_max_gas_estimate: 3000000   # Scroll pools often exceed 2M gas estimate
quoter_max_ticks_crossed: 40       # Allow up to 40 tick crossings

# v3.2.63: Spread thresholds for thin-liquidity chains
# Scroll has thinner liquidity than Arbitrum, so larger spreads are expected
suspect_spread_bps_hard: 1000  # Default 500 too aggressive for fallback-only chain
suspect_spread_bps: 400        # Diagnostic warning threshold

# L1 cost model: Scroll is a zk-rollup with proof-based batching
# v3.2.55: L1 cost per-txn is minimal compared to Arbitrum's calldata model
l1_data_gas_units: 0   # zk-rollup - no per-txn L1 data posting
l1_gas_price_gwei: 0   # Costs are amortized in proofs

# Token USD prices (for notional sizing)
tokens_usd_price:
  WETH: 2050.0       # on-chain ~2050 (2026-03-10)
  WBTC: 68000.0      # on-chain ~68000 (2026-02-26)
  USDC: 1.0
  USDT: 1.0
  wstETH: 2500.0     # ~1.22x WETH
  SCR: 0.50          # Scroll token
  STONE: 2100.0      # ~1.02x WETH
  weETH: 2100.0      # ~1.02x WETH

# Price sanity gates (relaxed for bootstrap)
price_sanity_max_deviation_bps: 10000

# Price anchor overrides for sanity checking
# R19: Adding anchors to reduce PRICE_SANITY_FAILED noise
tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WETH_WBTC: 0.030
  wstETH_WETH: 1.22
  USDC_USDT: 1.0

# Drift tolerance (relaxed for bootstrap)
drift_warning_pct: 30.0

# R17: Dynamic sweep for measured economics frontier (all-chain)
dynamic_probe:
  enabled: true
  sizes_usd: [25, 50, 75, 100]
  top_routes: 2

# Run kind: COVERAGE (won't update rolling)
run_kind: COVERAGE

# R27: Machine-readable blocker classification for dashboard
# Scroll is ECOSYSTEM_BLOCKED — nuri_v3 re-enabled (uniswap_v3/quoter_v2), cross-DEX now possible.
# R27 fix: nuri_v3 was incorrectly excluded as algebra-incompatible.
# Cross-DEX: nuri_v3 <-> sushiswap_v3 now configured. Online verification pending.
# Evidence (R26 scan): 0/3 PASS, 0 included signals. Expected until online re-verification.
blocker_classification: ECOSYSTEM_BLOCKED
blocker_reason: "cross_dex_unverified: nuri_v3 re-enabled R27 (uniswap_v3/quoter_v2), online proof pending"
blocker_resolution: "Run onboard_scroll_stage1.yaml online to verify nuri_v3 quoter_v2 produces cross-DEX signals"
stabilization_directive: >
  R27: ECOSYSTEM_BLOCKED — nuri_v3 re-enabled, online verification pending:
  Scroll now has 2 DEXes configured (nuri_v3 + sushiswap_v3), both uniswap_v3/quoter_v2.
  Cross-DEX arbitrage routes should be available if pools have liquidity.
  Previous state (R23): single DEX (sushiswap_v3 only), 0 included signals.
  R27 change: nuri_v3 added back after contract mismatch fix.
  Concrete actions:
  (1) run onboard_scroll_stage1.yaml --cycles 1 to verify nuri_v3 quoter_v2;
  (2) accepted_fail=true — do NOT count scroll failures toward max_fail_chains;
  (3) if nuri_v3 produces cross-DEX signals, update blocker to THIN_LIQUIDITY;
  (4) 2 pools quarantined (PRICE_SCALE_VIOLATION) — maintenance only;
  (5) do NOT promote to SIGNAL_PRODUCING until cross-DEX signals confirmed;
  (6) one PASS does NOT equal exit from ECOSYSTEM_BLOCKED — needs sustained evidence.
stabilization_kpi_target:
  status: CROSS_DEX_UNVERIFIED
  expected_included_signals: 0
  disabled_pool_count: 2
  next_review_trigger: onboard_scroll_stage1_online_run
  promotion_criteria: cross_dex_signals_gt_0_in_2_consecutive_runs

# M4.2 Truth-Semantics (MANDATORY for profit interpretation)
# v3.2.20: Full M4.2 semantics for contractual uniformity
truth_mode_m42: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4_COVERAGE
kill_switch_active: true
simulate_only: true

