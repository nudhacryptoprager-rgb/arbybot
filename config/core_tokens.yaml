# =============================================================================
# config/core_tokens.yaml - Token Registry (Tiered)
# =============================================================================
#
# This file serves two purposes:
#
# 1) TRUST ANCHORS (first ~10 tokens per chain):
#    WETH, USDC, USDC_E, USDT, DAI, WBTC, ARB, GMX, LINK, UNI
#    These are core tokens with hardcoded addresses that we trust absolutely.
#    They anchor the discovery system and are never auto-removed.
#
# 2) VERIFIED TOKENS (remaining tokens):
#    Tokens discovered by the intent system and verified on-chain via
#    scripts/verify_tokens.py. These can be added/rotated based on
#    discovery metrics but should remain stable once verified.
#
# Format: symbol -> {address, decimals, name, ...metadata}
# Addresses MUST be checksummed.
#
# Tier metadata (v3.3.0 — quality-ranked pair selection):
#   volatility_tier: high | medium | low   (price movement potential)
#   liquidity_tier:  high | medium | low   (on-chain TVL depth)
#   cross_dex_expected: int                 (# DEXes with real liquidity)
#   accounting_sensitive: true              (LST/LRT — peg-drift false profits)
#   productive_default: true | false        (included in productive contour)
#
# Contract: Do not remove TRUST ANCHOR tokens without explicit approval.
# Verified tokens may be rotated if discovery metrics degrade.
#
# Last updated: 2026-03-23
# =============================================================================

