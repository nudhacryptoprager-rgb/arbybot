# PATH: config/onboard_mantle_stage2.yaml
#
# ONBOARDING: mantle -> STAGE 2 (expanded with FusionX V3)
#
# STATUS: 3 executable DEXes (agni_v3, fusionx_v3, stratum).
# FusionX is an official Mantle V3 deployment and maps to the UniV3 adapter family.
# stratum (ve33) remains enabled to preserve the ve33 surface.
#
# OBJECTIVE: restore signal flow first.
#   Target: signals_count > 0 AND real_quote_count > 0 on consecutive runs.
#   Profitability work is deferred until signal flow is proven.
#
# STRUCTURAL REALITY:
#   - The prior 2-DEX contour had only 4 cross-DEX pairs and all were blocked
#   - FusionX V3 is added to test whether Mantle is blocked by missing supported surface
#   - Before running: clear quarantine with:
#       Remove-Item data\cache\quarantine_state_mantle.json
#   - Then refresh token prices with:
#       py -3.11 scripts/verify_tokens.py --chain mantle --all-new
#
# ADAPTER READINESS:
#   agni_v3 -> UniswapV3Adapter: PRODUCTION
#   fusionx_v3 -> UniswapV3Adapter: OFFICIAL CONTRACTS, newly enabled
#   stratum -> Ve33Adapter: PRODUCTION
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_mantle_stage2.yaml --cycles 1

chain: mantle
chain_id: 5000

run_kind: COVERAGE

rpc_endpoints:
  - "https://rpc.mantle.xyz"
  - "https://mantle.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

dexes:
  - agni_v3
  - fusionx_v3
  - stratum

discovery_runtime_max_pairs: 30
require_cross_dex: true

# R28.25: Roundtrip evaluation caps (aligned with primary)
roundtrip_max_candidates: 50
roundtrip_top_n: 15

use_multicall: true
use_quoter_v2: true

# R28.25: Aligned with primary economics contract (was 100/3)
use_usd_notional: true
target_usd_notional: 150.0

min_spread_bps: 5
paper_size_usd: 150
paper_slippage_bps: 5
gas_usd_estimate: 0.05

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

# Refresh with verify_tokens.py when market anchors drift materially.
tokens_usd_price:
  WMNT: 0.50
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDT: 1.0
  mETH: 2100.0
  cmETH: 2100.0
  mUSD: 1.0
  wstETH: 2500.0

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WETH_WMNT: 4100.0
  WMNT_USDC: 0.50
  mETH_WETH: 1.02
  WBTC_USDC: 68000.0
  USDC_USDT: 1.0
