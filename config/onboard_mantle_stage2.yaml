# PATH: config/onboard_mantle_stage2.yaml
#
# ONBOARDING: mantle → STAGE 2 (includes stratum ve33)
#
# STATUS: 2 executable DEXes (agni_v3, stratum).
# stratum (ve33) adapter IMPLEMENTED (R27.4). This config adds cross-DEX surface.
#
# R28.20 OBJECTIVE: RESTORE SIGNAL FLOW first.
#   Target: signals_count > 0 AND real_quote_count > 0 on consecutive runs.
#   Profitability work deferred until signal flow is proven.
#
# STRUCTURAL REALITY (R28.20):
#   - 12 intent pairs, only 4 cross-DEX (USDC/USDT, WETH/WMNT, WMNT/USDC, METH/WETH)
#   - stratum adds +0 incremental cross-DEX pairs in warm_pool_cache audit
#   - All 4 cross-DEX pairs blocked: quarantined + drift-excluded + price-sanity
#   - Root cause: stale token prices + stale quarantine from previous configs
#   - Before running: clear quarantine with:
#       Remove-Item data\cache\quarantine_state_mantle.json
#   - Then refresh token prices with:
#       py -3.11 scripts/verify_tokens.py --chain mantle --all-new
#
# ADAPTER READINESS:
#   agni_v3 → UniswapV3Adapter: PRODUCTION
#   stratum → Ve33Adapter: PRODUCTION (R27.4)
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_mantle_stage2.yaml --cycles 1

chain: mantle
chain_id: 5000

run_kind: COVERAGE

rpc_endpoints:
  - "https://rpc.mantle.xyz"
  - "https://mantle.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

# 2 DEXes: agni_v3 + stratum (ve33)
dexes:
  - agni_v3
  - stratum

discovery_runtime_max_pairs: 25
require_cross_dex: true

use_multicall: true
use_quoter_v2: true

use_usd_notional: true
target_usd_notional: 100.0

min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.05

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

# R28.20: Prices below may be stale. Run verify_tokens.py --chain mantle to refresh.
tokens_usd_price:
  WMNT: 0.50
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDT: 1.0
  mETH: 2100.0
  wstETH: 2500.0

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WETH_WMNT: 4100.0
  WMNT_USDC: 0.50
  mETH_WETH: 1.02
  WBTC_USDC: 68000.0
  USDC_USDT: 1.0
