# PATH: config/onboard_arbitrum_one_candidate.yaml
#
# ONBOARDING: arbitrum_one → CANDIDATE for exit gate
#
# STATUS: Primary chain (NORMAL rolling). This config adds camelot_v3
# on top of the existing productive contour (uniswap_v3 + sushiswap_v3)
# to test whether Algebra adapter coexists with UniV3 in the same scan.
#
# ADAPTER READINESS:
#   uniswap_v3 → UniswapV3Adapter: PRODUCTION
#   sushiswap_v3 → UniswapV3Adapter: PRODUCTION
#   camelot_v3 → AlgebraAdapter: PRODUCTION (registered, not in productive contour)
#   pancakeswap_v3 → UniswapV3Adapter: PRODUCTION
#
# PURPOSE: Verify 4-DEX additive contour on arbitrum_one before exit gate.
# RUN_KIND: COVERAGE (do NOT pollute rolling with unverified 4-DEX runs)
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_arbitrum_one_candidate.yaml --cycles 1

chain: arbitrum_one
chain_id: 42161

run_kind: COVERAGE

rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Full universe: intent.txt pairs resolved via discovery_runtime
universe_source: discovery_runtime

# All 4 DEXes — additive: uni + sushi + camelot + pancakeswap
dexes:
  - uniswap_v3
  - sushiswap_v3
  - camelot_v3
  - pancakeswap_v3

discovery_runtime_max_pairs: 30
require_cross_dex: true

use_multicall: true
use_quoter_v2: true

use_usd_notional: true
target_usd_notional: 100.0

min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.10

# M4.2 Truth mode
truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDT: 1.0
  ARB: 0.35
  wstETH: 2500.0
  LINK: 15.0
  GMX: 15.0
  RDNT: 0.04
  MAGIC: 0.35
  GRAIL: 1500.0

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WBTC_WETH: 33.0
  WBTC_USDC: 68000.0
  wstETH_WETH: 1.22
