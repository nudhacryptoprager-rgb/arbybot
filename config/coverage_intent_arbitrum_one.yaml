# PATH: config/coverage_intent_arbitrum_one.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (arbitrum_one)
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_arbitrum_one.yaml --cycles 1
#
# v3.2.17: Initial config for intent-driven universe testing

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
# v3.2.17: Enables factory.getPool() discovery via resolve_runtime_pairs()
universe_source: discovery_runtime

# DEXes to scan (all must have factory addresses in dexes.yaml)
# v3.2.17: Includes Algebra adapter (camelot_v3) and PancakeSwap V3
dexes:
  - uniswap_v3
  - sushiswap_v3
  - camelot_v3
  - pancakeswap_v3

# Discovery settings (CANONICAL KEYS per discovery/runtime.py contract)
# discovery_runtime_max_pairs: Cap on unique pairs to resolve (protects RPC budget)
# require_cross_dex: Only include pairs found on 2+ DEXes (better arb candidates)
discovery_runtime_max_pairs: 30
require_cross_dex: true

# Quoter V2 for executable quotes
use_quoter_v2: true

# Multicall batching (default ON)
use_multicall: true

# USD-notional sizing (M4.2) - use small notional to avoid NOTIONAL_DRIFT_EXCLUDED
use_usd_notional: true
target_usd_notional: 100.0

# Spread economics
min_spread_bps: 5
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.10

# Token USD prices (for notional sizing)
tokens_usd_price:
  WETH: 3000.0
  WBTC: 60000.0
  ARB: 1.5
  GMX: 30.0
  LINK: 15.0
  UNI: 10.0
  DAI: 1.0
  USDC: 1.0
  USDT: 1.0

# Price sanity gates (M4 bootstrap - relaxed)
price_sanity_max_deviation_bps: 5000  # 50% - will tighten in M5

# Anchor prices for sanity checks (discovery_runtime resolves from quotes)
tokens_anchor_price:
  WETH_USDC: 3000.0
  WBTC_WETH: 20.0
  ARB_WETH: 0.0005
  GMX_WETH: 0.01

# M4.2 Truth-Semantics (MANDATORY for profit interpretation)
truth_mode_m42: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4
kill_switch_active: true
simulate_only: true

# Run kind (CANONICAL KEY - determines rolling policy)
run_kind: COVERAGE
