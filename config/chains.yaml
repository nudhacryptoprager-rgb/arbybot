# PATH: config/chains.yaml
# Chain configuration - TRUST ANCHORS per Roadmap 4.1
# Only infrastructure data: chain_id, rpc, ws, explorer, native token

arbitrum_one:
  chain_id: 42161
  name: "Arbitrum One"
  native_symbol: "ETH"
  wrapped_native: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"  # WETH
  explorer: "https://arbiscan.io"
  rpc_endpoints:
    - "https://arb1.arbitrum.io/rpc"
    - "https://arbitrum-one.public.blastapi.io"
    - "https://arbitrum.publicnode.com"
    - "https://arbitrum.drpc.org"
  ws_endpoints:
    - "wss://arb1.arbitrum.io/ws"
  block_time_ms: 250
  confirmations: 1

base:
  chain_id: 8453
  name: "Base"
  native_symbol: "ETH"
  wrapped_native: "0x4200000000000000000000000000000000000006"  # WETH
  explorer: "https://basescan.org"
  # M7.E1.34n-soak9: switched primary HTTP+WS from public Flashblocks/blastapi
  # to dRPC to avoid JSON-RPC code-15 "Too many request" on eth_subscribe
  # that observed 100% of reconnect attempts fail in soak8.
  # Order matters: first entry = primary; others = 429-fallback.
  rpc_endpoints:
    - "https://base.drpc.org"
    - "https://base-rpc.publicnode.com"
    - "https://mainnet.base.org"
    - "https://base.public.blastapi.io"
  ws_endpoints:
    - "wss://base.drpc.org"
    - "wss://base-rpc.publicnode.com"
    - "wss://base.public.blastapi.io"
  # R39r: Flashblocks sub-block read-path (public, rate-limited — NOT for production submit)
  # R40.1: Corrected URL per https://docs.base.org/base-chain/api-reference/rpc-overview
  # soak9: disabled as primary hot-WS by default (set
  # ARBY_BASE_USE_FLASHBLOCKS_WS=1 to re-enable as primary; otherwise only
  # used as optional read-path inside Flashblocks watcher).
  flashblocks_ws_endpoint: "wss://mainnet-preconf.base.org"
  flashblocks_http_endpoint: "https://mainnet-preconf.base.org"
  block_time_ms: 2000
  confirmations: 1

