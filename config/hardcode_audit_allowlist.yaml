# Hardcode audit classifications (config-only chain data goal).
# Gate: scripts/check_hardcode_audit.py (+ check_repo_safety [22])
#
# ALLOWED_PROTOCOL_CONSTANT — zero/dead/selectors in code
# CONFIG_REQUIRED — tracked debt; addresses allowed until migrated
# DELETE_OR_ARCHIVE — must not exist at listed path (use scripts/archive/)
# scan_exempt_paths — fully migrated; gate skips file

schema_version: "hardcode_audit.2"

scan_exempt_paths:
  - discovery/graph_client.py
  - discovery/index_factories.py
  - monitoring/sniper_honeypot.py
  - strategy/sniper_entry_decision.py
  - m9/graph_arb/core_tokens_loader.py
  - m9/graph_arb/token_decimals.py
  - m9/graph_arb/token_price_fetcher.py
  - m9/graph_arb/token_metadata.py
  - m9/graph_arb/builder.py
  - scripts/check_hardcode_audit.py
  - scripts/discover_curve_indices.py

ALLOWED_PROTOCOL_CONSTANT:
  - path: m9/graph_arb/token_decimals.py
    note: "ERC20 decimals() selector"
  - path: m9/graph_arb/builder.py
    note: "Sentinel zero address"
  - path: discovery/index_factories.py
    note: "Zero pool/pair sentinel checks"
  - path: monitoring/sniper_honeypot.py
    address: "0x000000000000000000000000000000000000dead"
    note: "Burn sentinel for honeypot FAIL"

