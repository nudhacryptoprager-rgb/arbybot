# PATH: config/real_minimal.yaml
#
# M4 REAL Pipeline - CANARY CONFIG
#
# METRICS CONTRACT (STEP 1):
# - quotes_total = attempted quote calls
# - quotes_fetched = got valid RPC response (amount_out > 0)
# - gates_passed = passed all gates (price sanity, etc.)
# - dexes_active = DEXes with at least 1 response
#
# BOOTSTRAP THRESHOLDS (STEP 6):
# - max_deviation_bps = 5000 (50%) for M4 bootstrap
# - Will tighten to 1000 (10%) in M5 after validation
#
# Environment Variable Overrides:
#   ARBY_RPC_URL - Add custom RPC endpoint (priority)
#   ARBY_RPC_TIMEOUT - RPC timeout in seconds (default: 10)
#   ARBY_RPC_RETRIES - Max retries per endpoint (default: 3)
#   ARBY_RPC_BACKOFF_MS - Base backoff in ms (default: 500)
#   ARBY_PRICE_SANITY_DISABLED - Disable price sanity gate
#   ARBY_PRICE_SANITY_MAX_DEV - Override max_deviation_bps
#
# M4 Requirements (STRICT):
# - quotes_fetched >= 1
# - rpc_success_rate > 0
# - rpc_total_requests >= 3
# - dexes_active >= 2 (DEXes with responses)
# - price_sanity_passed >= 1
# - confidence < 1.0 (dynamic)

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage
dexes:
  - uniswap_v3
  - sushiswap_v3

# M5 pairs: ONLY pairs with verified pool addresses on BOTH DEXes
# Pairs without pool addresses on all configured DEXes will be rejected as POOL_MISSING
# All pool addresses verified via factory.getPool() on 2026-02-07
pairs:
  # Major pairs with high liquidity on both DEXes
  - token_in: WETH
    token_out: USDC
    fee_tiers: [500, 3000]
  - token_in: WETH
    token_out: USDT
    fee_tiers: [500, 3000]
  # NOTE: WBTC pairs disabled - decimal overflow in price calc (8 vs 18 decimals)
  # - token_in: WBTC
  #   token_out: WETH
  #   fee_tiers: [500, 3000]
  - token_in: ARB
    token_out: WETH
    fee_tiers: [500, 3000]
  # NOTE: LINK disabled - SushiSwap pool has low liquidity (11% spread)
  # - token_in: LINK
  #   token_out: WETH
  #   fee_tiers: [500, 3000]
  # NOTE: GMX disabled - low liquidity causes price outliers (173% spread)
  # - token_in: GMX
  #   token_out: WETH
  #   fee_tiers: [500, 3000]
  - token_in: wstETH
    token_out: WETH
    fee_tiers: [100, 500]
  - token_in: ARB
    token_out: USDC
    fee_tiers: [500, 3000]
  # NOTE: WBTC/USDC disabled - same decimal issue
  # - token_in: WBTC
  #   token_out: USDC
  #   fee_tiers: [500, 3000]

