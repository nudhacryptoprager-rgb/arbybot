# PATH: config/real_minimal_intent_forced.yaml
#
# M4 REAL Pipeline - INTENT_FORCED mode for testing
# Uses intent.txt pairs instead of config pairs
#
# NOTE: This does NOT verify pools on-chain. Pool addresses
# still come from the pools section. Only PAIR SELECTION
# is from intent.txt. See verify_v3_pools.py for on-chain verification.
#

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# Universe source: intent_forced - use pairs from intent.txt
universe_source: intent_forced

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage
dexes:
  - uniswap_v3
  - sushiswap_v3

# No pairs section - will use intent.txt via intent_forced mode
# (pairs list intentionally omitted)

# Pool addresses - still required even with intent_forced
# (intent defines WHICH pairs, but pools section defines WHERE to find them)
# Inherit from real_minimal.yaml via !include would be ideal but YAML doesn't support it natively
