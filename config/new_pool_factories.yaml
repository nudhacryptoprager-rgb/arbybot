    topic0: "0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118"
    log_layout: v3_pool_created
    # Verified 2026-05-13 via drpc (2 events at block 45926270 found in this range).
    verification_from_block: 45926100
    verification_to_block: 45926500

  # -------------------------------------------------------------------------
  # Uniswap V4 (Base) — PoolManager singleton, Initialize event.
  # Address: official Uniswap V4 PoolManager on Base
  # Source: https://developers.uniswap.org/docs/protocols/v4/deployments
  # Event: Initialize(PoolId indexed id, address indexed currency0,
  #                   address indexed currency1, uint24 fee, int24 tickSpacing,
  #                   IHooks hooks, uint160 sqrtPriceX96, int24 tick)
  # Note: In V4 there is no per-pool contract; ``pool`` field stores the
  #       PoolId (bytes32) as a unique identifier instead of an address.
  # topic0: keccak256("Initialize(bytes32,address,address,uint24,int24,address,uint160,int24)")
  #         = 0xdd466e674ea557f56295e2d0218a125ea4b4f0f6f3307b95f85e6110838d6438
  # Verified 2026-05-14 via drpc (575 events per hour on Base live chain).
  # -------------------------------------------------------------------------
  - dex: uniswap_v4
    adapter_type: uniswap_v4
    factory: "0x498581fF718922c3f8e6a244956af099b2652b2b"
    event_name: Initialize
    event_signature: "Initialize(bytes32,address,address,uint24,int24,address,uint160,int24)"
    topic0: "0xdd466e674ea557f56295e2d0218a125ea4b4f0f6f3307b95f85e6110838d6438"
    topic0_verified: true
    log_layout: v4_initialize
    discovery_only: true  # PoolManager is a listener-only source; V4 execution path not yet approved
    # Verified 2026-05-14 via drpc (49 events in blocks 45990736-45990836).
    verification_from_block: 45990736
    verification_to_block: 45990836

