    topic0: "0x0d3648bd0f6ba80134a33ba9275ac585d9d315f0ad8355cddefde31afa28d0e9"
    topic0_verified: true
    log_layout: v2_pair_created
    experimental: true
    discovery_only: true
    verification_from_block: 45990779
    verification_to_block: 45990879

