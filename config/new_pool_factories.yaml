# M8 Phase 1 — Factory listener config for new-pool sniping (Base chain).
#
# ADDRESSES: All factory addresses are sourced directly from config/dexes.yaml
# where they are already verified with on-chain/official documentation links.
# Do NOT add addresses from memory; add only after cross-checking config/dexes.yaml
# or the referenced source URL.
#
# TOPIC0: keccak256 of the event signature (canonical Solidity ABI signature).
# Marked null where not yet independently verified from contract source/ABI.
# Self-test (startup eth_getLogs replay) is the authoritative verification gate.
#
# VERIFICATION BLOCKS: left null here. Set verification_from_block and
# verification_to_block to a known bounded range (e.g. 20000-block window) that
# is guaranteed to contain at least one PoolCreated/PairCreated event before
# deploying the listener. The self-test uses these to confirm the parser works.
#
# IMPORTANT: Do not add factories for chains other than base in this file.
# Multi-chain support will be a separate config per chain.

chain: base

factories:

  # -------------------------------------------------------------------------
  # Uniswap V3 (Base) — concentrated liquidity, fee-tiered pools.
  # Address: config/dexes.yaml base.uniswap_v3.factory
  # Event: PoolCreated(address indexed token0, address indexed token1,
  #                    uint24 indexed fee, int24 tickSpacing, address pool)
  # topic0: keccak256("PoolCreated(address,address,uint24,int24,address)")
  #         = 0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118
  # Source: https://github.com/Uniswap/v3-core (UniswapV3Factory.sol)
  # -------------------------------------------------------------------------
  - dex: uniswap_v3
    adapter_type: uniswap_v3
    factory: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
    event_name: PoolCreated
    event_signature: "PoolCreated(address,address,uint24,int24,address)"
    topic0: "0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118"
    # Log layout: topics[1]=token0, topics[2]=token1, topics[3]=fee
    #             data = abi.encode(int24 tickSpacing, address pool)
    log_layout: v3_pool_created
    # Verified 2026-05-14 via drpc (2 events in this range; head=45992560).
    verification_from_block: 45992100
    verification_to_block: 45992560

  # -------------------------------------------------------------------------
  # Aerodrome Slipstream CL (Base) — concentrated liquidity, tick-spacing.
  # Address: config/dexes.yaml base.aerodrome_slipstream.factory
  # Verified: https://aerodrome.finance/security (Base CL factory)
  # Event: PoolCreated(address indexed token0, address indexed token1,
  #                    int24 indexed tickSpacing, address pool)
  # topic0: keccak256("PoolCreated(address,address,int24,address)") — PENDING
  #         verification against deployed contract ABI; set null until confirmed.
  # -------------------------------------------------------------------------
  - dex: aerodrome_slipstream
    adapter_type: aerodrome_slipstream
    factory: "0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A"
    event_name: PoolCreated
    event_signature: "PoolCreated(address,address,int24,address)"
    # topic0 verified 2025-07-15 against velodrome-finance/slipstream ICLFactory.sol:
    # event PoolCreated(address indexed token0, address indexed token1, int24 indexed tickSpacing, address pool)
    # keccak256("PoolCreated(address,address,int24,address)") = 0xab0d57f0...
    topic0: "0xab0d57f0df537bb25e80245ef7748fa62353808c54d6e528a9dd20887aed9ac2"
    topic0_verified: true
    # Log layout: topics[1]=token0, topics[2]=token1, topics[3]=tickSpacing (indexed)
    #             data = abi.encode(address pool)
    log_layout: slipstream_pool_created
    # Verified 2026-05-13 via drpc (1 event at block 45920986 found in this range).
    verification_from_block: 45920743
    verification_to_block: 45921242

  # -------------------------------------------------------------------------
  # Aerodrome ve33 (Base) -- volatile + stable pools.
  # Address: config/dexes.yaml base.aerodrome.factory
  # Event: PoolCreated(address indexed token0, address indexed token1,
  #                    bool indexed stable, address pool, uint256)
  # topic0: keccak256("PoolCreated(address,address,bool,address,uint256)")
  #         = 0x2128d88d14c80cb081c1252a5acff7a264671bf199ce226b53788fb26065005e
  # Source: Aerodrome / Velodrome ve33 PoolFactory event signature.
  # -------------------------------------------------------------------------
  - dex: aerodrome
    adapter_type: ve33
    factory: "0x420DD381b31aEf6683db6B902084cB0FFECe40Da"
    event_name: PoolCreated
    event_signature: "PoolCreated(address,address,bool,address,uint256)"
    topic0: "0x2128d88d14c80cb081c1252a5acff7a264671bf199ce226b53788fb26065005e"
    topic0_verified: true
    # Log layout: topics[1]=token0, topics[2]=token1, topics[3]=stable
    #             data = abi.encode(address pool, uint256 allPools)
    log_layout: ve33_pool_created
    # Verified 2026-05-14 via public Base RPC
    # (1 event at block 45925521 found in this range).
    verification_from_block: 45925000
    verification_to_block: 45926000

  # -------------------------------------------------------------------------
  # PancakeSwap V3 (Base) — same factory interface as Uniswap V3.
  # Address: config/dexes.yaml base.pancakeswap_v3.factory
