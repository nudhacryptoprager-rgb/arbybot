# PATH: config/coverage_intent_zksync.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (zkSync Era)
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline on zkSync Era.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_zksync.yaml --cycles 1
#
# v3.2.20: Initial config for zkSync Era multi-chain rollout
# NOTE: zkSync Era uses different VM, some DEX adapters may need adjustment

# Chain: zkSync Era
chain: zksync
chain_id: 324

# RPC endpoints with fallback
rpc_endpoints:
  - "https://mainnet.era.zksync.io"
  - "https://zksync.public.blastapi.io"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
# v3.2.17: Enables factory.getPool() discovery via resolve_runtime_pairs()
universe_source: discovery_runtime

# DEXes to scan (must have factory addresses in dexes.yaml)
# v3.2.36: zkSync now has 2 DEXes - uniswap_v3 + pancakeswap_v3
dexes:
  - uniswap_v3
  - pancakeswap_v3

# Discovery settings
discovery_runtime_max_pairs: 20
require_cross_dex: true  # 2 DEXes on zkSync

# Quoter V2: Required for M4.2 truth mode
# Both uniswap_v3 and pancakeswap_v3 on zkSync support quoter_v2
use_quoter_v2: true

# Multicall batching (default ON)
use_multicall: true

# USD-notional sizing (M4.2)
use_usd_notional: true
target_usd_notional: 100.0

# Spread economics
# v3.2.50: min_spread_bps lowered from 5 to 3 for better signal capture
# Rationale: zkSync gas_usd_estimate=0.01 means 3bps spread is highly profitable
#            on 100 USD notional (0.03 USD spread >> 0.01 USD gas)
min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.01  # zkSync is very cheap

# v3.2.60: Relaxed SUSPECT_SPREAD_HARD threshold for zkSync Era
# zkSync has thinner liquidity than Arbitrum, so larger spreads are common
# Evidence from runDir 185400: max_gated_spread=398bps, 33 rejects at 500bps threshold
# v3.2.63: Raised to 1000bps to allow more signal capture
suspect_spread_bps_hard: 1000  # Default 500 too aggressive for zkSync
suspect_spread_bps: 400       # Diagnostic warning threshold

# v3.2.62: Aggressively relaxed SUSPECT_LIQUIDITY thresholds for zkSync Era
# zkSync pools report very high gas_estimate (2M-27M) due to different zkEVM
# This is expected behavior for zkSync - the gas estimates are not comparable to EVM
# Default 500k is too aggressive - raise to 30M to allow all zkSync pools
quoter_max_gas_estimate: 30000000  # zkSync VM reports 10-100x higher gas than EVM
quoter_max_ticks_crossed: 50       # Allow more tick crossings for thin liquidity

# L1 cost model: zkSync uses zk-proofs, NOT Arbitrum-style L1 data posting
# v3.2.55: Disable Arbitrum L1 cost model for zkSync Era
# zkSync batches txns via validity proofs, so per-txn L1 cost is ~0
l1_data_gas_units: 0
l1_gas_price_gwei: 0

# Token USD prices (for notional sizing)
tokens_usd_price:
  WETH: 3000.0
  WBTC: 60000.0
  USDC: 1.0
  USDT: 1.0
  ZK: 0.15         # zkSync token
  HOLD: 0.001

# Price sanity gates (relaxed for bootstrap)
price_sanity_max_deviation_bps: 10000

# Drift tolerance (relaxed for bootstrap)
drift_warning_pct: 30.0

# Run kind: COVERAGE (won't update rolling)
run_kind: COVERAGE

# M4.2 Truth-Semantics (MANDATORY for profit interpretation)
# v3.2.20: Full M4.2 semantics for contractual uniformity
truth_mode_m42: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4_COVERAGE
kill_switch_active: true
simulate_only: true
