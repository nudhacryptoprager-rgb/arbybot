# PATH: config/coverage_intent_zksync.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (zkSync Era)
#
# CHAIN QUALITY STATUS (2026-03-10 session 3):
#   Classification: REJECT_DOMINANT (49 rejects, 22 fetched, suspect 2/3)
#   Evidence: runDir 120608 - 3 signals, 1 included (380bps WETH/USDC), $0.84
#   Root cause: ZK/* pairs consistently PRICE_SANITY_FAILED + LIQUIDITY_ZERO
#     USDC/USDT, WETH/WBTC, WETH/USDT all fail sanity (no anchors provided)
#   Fix (session 3): Exclude ZK/*, add anchors for USDC/USDT + WETH/WBTC.
#     Also exclude */USDT (WETH/USDT, ZK/USDT all PRICE_SANITY_FAILED).
#   Remaining universe: WETH/USDC, wstETH/WETH, WBTC/USDC (with anchor).
#   Target: suspect_count/total_count < 0.50
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline on zkSync Era.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_zksync.yaml --cycles 1
#
# v3.2.20: Initial config for zkSync Era multi-chain rollout
# NOTE: zkSync Era uses different VM, some DEX adapters may need adjustment

# Chain: zkSync Era
chain: zksync
chain_id: 324

# RPC endpoints with fallback
rpc_endpoints:
  - "https://mainnet.era.zksync.io"
  - "https://zksync.public.blastapi.io"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
# v3.2.17: Enables factory.getPool() discovery via resolve_runtime_pairs()
universe_source: discovery_runtime

# DEXes to scan (must have factory addresses in dexes.yaml)
# v3.2.36: zkSync now has 2 DEXes - uniswap_v3 + pancakeswap_v3
dexes:
  - uniswap_v3
  - pancakeswap_v3

# Discovery settings
discovery_runtime_max_pairs: 20
# v3.2.70: require_cross_dex=false — zkSync has only 1 cross-DEX pair (WETH/WBTC),
# enabling same-DEX fee-tier arb unlocks WETH/USDC, wstETH/WETH signals
# across 100/500/3000/10000 bps tiers on uniswap_v3 and pancakeswap_v3
require_cross_dex: false

# Quoter V2: Required for M4.2 truth mode
# Both uniswap_v3 and pancakeswap_v3 on zkSync support quoter_v2
use_quoter_v2: true

# Multicall batching (default ON)
use_multicall: true

# USD-notional sizing (M4.2)
# v3.2.72: Lowered from 100 to 25 — zkSync pools have very thin liquidity
# At $100 notional, 23/32 quotes show >80% drift (price impact destroys price accuracy)
# At $25 notional, price impact is ~4x less, enabling tighter cross-pool spreads
use_usd_notional: true
target_usd_notional: 25.0

# Spread economics
# v3.2.50: min_spread_bps lowered from 5 to 3 for better signal capture
# Rationale: zkSync gas_usd_estimate=0.01 means 3bps spread is highly profitable
#            on 100 USD notional (0.03 USD spread >> 0.01 USD gas)
min_spread_bps: 3
paper_size_usd: 25    # v3.2.72: matched to target_usd_notional (was 100)
paper_slippage_bps: 5
gas_usd_estimate: 0.01  # zkSync is very cheap

# v3.2.60: Relaxed SUSPECT_SPREAD_HARD threshold for zkSync Era
# zkSync has thinner liquidity than Arbitrum, so larger spreads are common
# Evidence from runDir 185400: max_gated_spread=398bps, 33 rejects at 500bps threshold
# v3.2.63: Raised to 1000bps to allow more signal capture
# v3.2.64 THIN LIQUIDITY STATUS (runDir 194223):
#   - 34 opportunities total, 8 gated, 26 rejected SUSPECT_SPREAD_HARD
#   - max_gated_spread=623bps (OK, within 1000 threshold)
#   - 26 rejects have >1000bps (>10%) spreads - indicates stale prices/bad data
#   - This is MARKET_CONSTRAINED, not code bug: infrastructure works, liquidity doesn't
#   - Pairs with >10% spreads: likely HOLD/*, ZK/USDT, thin stablecoin crossing
suspect_spread_bps_hard: 1000  # Default 500 too aggressive for zkSync
suspect_spread_bps: 400       # Diagnostic warning threshold

# v3.2.62: Aggressively relaxed SUSPECT_LIQUIDITY thresholds for zkSync Era
# zkSync pools report very high gas_estimate (2M-27M) due to different zkEVM
# This is expected behavior for zkSync - the gas estimates are not comparable to EVM
# Default 500k is too aggressive - raise to 30M to allow all zkSync pools
quoter_max_gas_estimate: 30000000  # zkSync VM reports 10-100x higher gas than EVM
quoter_max_ticks_crossed: 50       # Allow more tick crossings for thin liquidity

# L1 cost model: zkSync uses zk-proofs, NOT Arbitrum-style L1 data posting
# v3.2.55: Disable Arbitrum L1 cost model for zkSync Era
# zkSync batches txns via validity proofs, so per-txn L1 cost is ~0
l1_data_gas_units: 0
l1_gas_price_gwei: 0

# Token USD prices (for notional sizing)
# v3.2.66: Removed meme tokens that consistently have zero liquidity or bad data
# Removed: HOLD, CHEEMS, MUTE, SPACE (LIQUIDITY_ZERO or >10% spreads)
tokens_usd_price:
  WETH: 2050.0       # on-chain ~2050 (2026-03-10)
  WBTC: 68000.0      # on-chain ~68000 (2026-02-26)
  USDC: 1.0
  USDT: 1.0
  ZK: 0.15           # zkSync token
  wstETH: 2500.0     # ~1.22x WETH

# v3.2.66: Pair exclusions for zkSync
# These pairs consistently produce bad data (SUSPECT_SPREAD_HARD >1000bps)
# or zero liquidity (LIQUIDITY_ZERO) - removing from discovery reduces noise
# NOTE: These are still in intent.txt but won't match tokens_usd_price
#       Missing price = pair skipped during notional sizing
excluded_pair_hints:
  - "HOLD/*"       # LIQUIDITY_ZERO on all HOLD pools
  - "CHEEMS/*"     # Meme token, stale prices
  - "MUTE/*"       # Meme token, stale prices
  - "SPACE/*"      # Meme token, stale prices
  - "ZK/*"         # Session 3: consistently PRICE_SANITY_FAILED + LIQUIDITY_ZERO
  - "*/USDT"       # Session 3: WETH/USDT, ZK/USDT all fail PRICE_SANITY on zkSync

# Price anchor overrides for sanity checking
tokens_anchor_price:
  WETH_USDC: 2050.0     # aligned with tokens_usd_price
  WETH_WBTC: 0.030      # 2050/68000
  USDC_USDT: 1.0        # Session 3: stablecoin anchor for sanity check
  WBTC_USDC: 68000.0    # Session 3: BTC anchor for sanity check
  wstETH_WETH: 1.22     # ~1.22 WETH per wstETH

# Price sanity gates (relaxed for bootstrap)
price_sanity_max_deviation_bps: 10000

# Drift tolerance
# v3.2.72: Widened from 30 to 40% — with $25 notional, more pools should pass
# but some borderline pools (e.g., pancakeswap WETH/USDC) may still need slack
drift_warning_pct: 40.0

# R17: Dynamic sweep for measured economics frontier (all-chain)
dynamic_probe:
  enabled: true
  sizes_usd: [25, 50, 75, 100]
  top_routes: 2

# Run kind: COVERAGE (won't update rolling)
run_kind: COVERAGE

# R23: Machine-readable blocker classification for dashboard
# ZKsync is FRONTIER_READY — gap_to_zero=0.0 bps (18/18 sweep runs), best economics.
# But: drift_rejection_rate=37.0% is highest of all PASS chains, worst_pair=9960 bps.
# Classification: MIXED (frontier + drift) — strong breakeven signal, unreliable quote quality.
# Evidence (R22 scan): 18/18 PASS, 18 signals, $10.88 net, gap=0.0 bps consistently.
blocker_classification: MIXED
blocker_reason: "frontier_ready_drift_heavy: gap=0.0 bps but 37.0% drift rejection, worst_pair=9960 bps"
blocker_resolution: "Reduce drift rejection below 30% via pair-specific exclusion; stabilize for truth-probe promotion"
stabilization_directive: >
  R23: MIXED blocker (frontier + drift). Honest assessment:
  STRONG: gap_to_zero=0.0 bps across all 18 sweep runs (BEST of all chains),
  frontier_rank=#1, cross_dex=10 pairs, target_for_truth_probe=true.
  WEAK: drift_rejection_rate_median=37.0% (worst of PASS chains),
  notional_drift_median=1472 bps, drift_worst_pair=9960 bps (near 100%),
  drift_excluded_total=308 (highest of all chains).
  Concrete targets:
  (1) target_usd_notional=25 kept — essential for pool depth;
  (2) drift_warning_pct=40% — borderline ok but does NOT solve worst pairs;
  (3) identify top-3 drift offenders from per_pair_drift_summary and exclude;
  (4) max_per_pair_rejection_rate=0.40 — enforce: exclude pairs >40% rejection after 10 runs;
  (5) once drift_rejection_rate < 0.30 sustained across 10+ runs, reclassify to NEAR_BREAKEVEN;
  (6) keep as truth_probe target — economics are the best of any chain.
stabilization_kpi_target:
  min_included_signals: 2
  max_drift_rejection_rate: 0.30
  max_per_pair_rejection_rate: 0.40
  gap_to_zero_reclassify_threshold_bps: 5
  runs_for_reclassify: 10

# M4.2 Truth-Semantics (MANDATORY for profit interpretation)
# v3.2.20: Full M4.2 semantics for contractual uniformity
truth_mode_m42: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4_COVERAGE
kill_switch_active: true
simulate_only: true
