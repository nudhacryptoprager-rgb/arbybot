# Minimal required sections (defaults used by config_loader.py)
pairs: []

factory_ladder: {}

health_filter:
  min_liquidity: 0
  require_slot0_unlocked: false
  require_sqrt_price_positive: false

quote_gate:
  target_quote_success_rate: 0.5
  target_rpc_error_rate_max: 0.3
  async_max_workers: 4
  async_timeout_s: 10
  retry_backoff_s: 1.0

sizes_usd: [100.0]

# Step 8 (GPT): lock scan_params in config — runner reads these as overrides
# over CLI defaults when CLI was not explicitly changed.
# Fix 6: dynamic_sizes is the canonical productive path — always enabled here.
# Fix 7: sizes_usd here sets infra_telemetry.sizes_usd_source="config.scan_params".
# Fix 8: always run with --require-factory-verified for production proof-runs.
scan_params:
  sizes_usd: [100.0, 250.0, 500.0]          # free-tier safe ladder
  dynamic_sizes: true                        # canonical productive default (Fix 6)
  dynamic_size_max_cycles: 3                 # conservative for free-tier RPC

cost_model:
  default_profile: default
  profiles:
    default:
      gas_usd: 0.05
      l1_fee_usd: 0.01
      slippage_bps: 5.0
  gas_mode_default: static
  paper_haircut: 0.0
  slippage_mode_default: static

replay:
  enabled_by_default: false
  top_n_near_misses: 0
  anvil_url_default: "http://127.0.0.1:8545"
  fork_block_default: "latest"
  require_non_stub: false

simulation:
  univ3_router02: "0x0000000000000000000000000000000000000000"
  aero_router: "0x0000000000000000000000000000000000000000"
  simulation_test_addr: "0x0000000000000000000000000000000000000000"
  usdc_usdt_v3_pool: "0x0000000000000000000000000000000000000000"

public_rpc_blocklist: []
