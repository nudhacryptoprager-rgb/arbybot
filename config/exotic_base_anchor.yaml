# M9 Graph-Arb exotic pairs config — Base chain
# Used by m9/graph_arb/builder.py via M8_1Config (m8_1.stable_anchor.config_loader)
# Schema: m8_1.0  NOTE: use "quoter:" key (not "quoter_v2:") — _parse_dex reads raw.get("quoter")
# ALL addresses MUST be lowercase 0x + 40 hex chars (_ADDR_RE = r"^0x[0-9a-f]{40}$")
schema_version: "m8_1.0"
chain: base
chain_id: 8453

dexes:
  uniswap_v3:
    adapter_type: uniswap_v3
    factory: "0x33128a8fc17869897dce68ed026d694621f6fdfd"
    quoter: "0x3d4e44eb1374240ce5f1b871ab261cd16335b76a"
    fee_tiers: [100, 500, 3000, 10000]
    enabled: true

  pancakeswap_v3:
    adapter_type: uniswap_v3
    factory: "0x0bfbcf9fa4f9c56b0f40a671ad40e0805a091865"
    quoter: "0xb048bbc1ee6b733fffcfb9e9cef7375518e25997"
    fee_tiers: [100, 500, 2500, 10000]
    enabled: true

  sushiswap_v3:
    adapter_type: uniswap_v3
    factory: "0xc35dadb65012ec5796536bd9864ed8773abc74c4"
    quoter: "0xb1e835dc2785b52265711e17fccb0fd018226a6e"
    fee_tiers: [100, 500, 3000, 10000]
    enabled: true

  aerodrome_slipstream:
    adapter_type: aerodrome_slipstream
    factory: "0x5e7bb104d84c7cb9b682aac2f3d509f5f406809a"
    quoter: "0x254cf9e1e6e233aa1ac962cb9b05b2cfeaae15b0"
    tick_spacings: [1, 50, 100, 200, 2000]
    fee_tiers: [1, 50, 100, 200, 2000]
    enabled: true

  # Aerodrome ve33 volatile pools. Quote via pool.getAmountOut(amountIn, tokenIn).
  # builder.py sets quoter_addr=pool_address for ve33; raw_http_probe uses f140a35a selector.
  aerodrome:
    adapter_type: ve33
    factory: "0x420dd381b31aef6683db6b902084cb0ffece40da"
    enabled: true

  # Aerodrome V2 stable pools (x³y + xy³ = k invariant, 1 bps fee).
  # Same Aerodrome factory; pool.stable=true distinguishes them at creation.
  # builder.py sets quoter_addr=pool_address for aerodrome_v2_stable.
  # raw_http_probe uses the same f140a35a selector (pool.getAmountOut).
  aerodrome_v2_stable:
    adapter_type: aerodrome_v2_stable
    factory: "0x420dd381b31aef6683db6b902084cb0ffece40da"
    enabled: true

  # UniswapV2 on Base (factory 0x8909...). Quote via pool.getReserves(); builder sets quoter=pool.
  uniswap_v2:
    adapter_type: uniswap_v2
    factory: "0x8909dc15e40173ff4699343b6eb8132c65e18ec6"
    enabled: true

  # SushiSwap V2 on Base — UniswapV2 fork. Same adapter, different factory.
  sushiswap_v2:
    adapter_type: uniswap_v2
    factory: "0x71524b4f93c58fcbf659783284e38825f0622859"
    enabled: true

  # BaseSwap V2 on Base — Base-native UniswapV2 fork.
  baseswap_v2:
    adapter_type: uniswap_v2
    factory: "0xfda619b6d20975be80a10332cd39b9a4b0faa8bb"
    enabled: true

  # Uniswap V4 on Base — PoolManager singleton; only vanilla pools (hooks==0x0).
  # Quoter: https://developers.uniswap.org/docs/protocols/v4/deployments
  # Discovery is dynamic via M8 sniper Initialize events (not static fee-tier enumeration).
  uniswap_v4:
    adapter_type: uniswap_v4
    factory: "0x498581ff718922c3f8e6a244956af099b2652b2b"  # PoolManager
    quoter: "0x0d5e0f971ed27fbff6c2837bf31316121532048d"  # Quoter
    fee_tiers: [100, 500, 3000, 10000]
    enabled: true

  # Curve Stable-NG on Base — factory-stable-ng factory.
  # Quote adapter: raw_http_probe.py get_dy(i,j,dx) via token_in_index/token_out_index
  # from config/adapter_metadata.yaml (coin_indices). Enabled: 2 real pools populated.
  curve_stable:
    adapter_type: curve_stable
    factory: "0xd2002373543ce3527023c75e7518c274a51ce712"  # Curve Stable-NG factory on Base
    enabled: true

  # Balancer V2 Vault on Base — queryBatchSwap via balancer_vault.py adapter.
  # Pool IDs are loaded from config/adapter_metadata.yaml balancer.base.pools section.
  # To add pools: verify pool_id via Vault.getPoolTokens(poolId) on-chain, then add
  # to adapter_metadata.yaml following the existing curve section pattern.
  balancer_vault:
    adapter_type: balancer_stable
    factory: "0xba12222222228d8ba445958a75a0704d566bf2c8"  # Balancer V2 Vault on Base
    enabled: true

  # Maverick V2 directional-liquidity pools on Base.
  # Quotes via PoolInformation.calculateSwap (single eth_call, no router needed).
  # Token direction (tokenAIn) is resolved from adapter_metadata.yaml token_a field,
  # or via a live tokenA() call on the pool contract if not pre-configured.
  maverick_v2:
    adapter_type: maverick_v2
    factory: "0x0a7e848aca42d879ef06507fca0e7b33a0a63c1e"  # Maverick V2 factory on Base
    enabled: true

