# =============================================================================
# config/enricher.yaml — M8 Phase 2 EntryCandidateEnricher Configuration
# =============================================================================
#
# All monetary values in USD.  Changes here take effect without code changes.
# Bump schema_revision in monitoring/sniper_artifacts.py when changing
# thresholds materially (affects rolling artifact comparability).
#
# Token addresses: Base mainnet, all-lowercase (no EIP-55 checksum).
# =============================================================================

# Conservative USD prices for anchor tokens.
# Update WETH price manually when it drifts >10% (~weekly review).
anchor_token_usd:
  "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913": 1.0    # USDC  (6 dec)
  "0x4200000000000000000000000000000000000006": 2500.0  # WETH  (18 dec)
  "0x50c5725949a6f0c72e6c4a641f24049a917db0cb": 1.0    # DAI   (18 dec)
  "0xd9aaec86b65d86f6a7b5b1b0c42ffa531710b6ca": 1.0    # USDbC (6 dec)
  "0x0000000000000000000000000000000000000000": 2500.0  # Native ETH sentinel (V4) → priced as WETH

# Uniswap V4 state access. The StateView lens contract exposes per-pool
# slot0 / liquidity from the PoolManager singleton, which lets us treat
# V4 like V3 (virtual-reserve approximation). Set v4_enabled: false to
# fall back to the legacy V4_SKIP behaviour (no V4 reserves fetched).
v4_enabled: true
v4_stateview_address: "0xa3c0c9b65bad0b08107aa264b0f3db444b867a71"  # Base mainnet

# USD amount used for the SlippageGuard $-probe trade.
slippage_probe_usd: 100.0

# Fraction of spread realistically captured per trade (conservative).
# 0.5 = 50% capture rate (accounts for partial fill, price movement).
capture_rate: 0.5

# Estimated gas cost per trade on Base L2 (USD).
# Base L2 typical range: $0.05–$0.50; use conservative upper bound.
gas_cost_usd: 0.30

# Minimum thresholds (documented here; enforced by EntryDecisionEngine
# via DEFAULT_MIN_LIQUIDITY_USD and DEFAULT_MIN_SPREAD_BPS).
min_liquidity_usd: 1000.0
min_spread_bps: 50.0
