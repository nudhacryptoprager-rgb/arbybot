# Quote sizing: 1 ETH
quote_amount_in_wei: "1000000000000000000"

# Gate thresholds
max_slippage_bps: 100
min_net_bps: 5

# Price sanity gate (M4 bootstrap thresholds)
price_sanity_enabled: true
price_sanity_max_deviation_bps: 5000  # 50% for bootstrap

# Paper trading - REDUCED SIZE FOR ROUNDTRIP VIABILITY
cooldown_seconds: 60
notion_capital_usdc: "10000.000000"

# M5 Cost model (gas-only)
gas_usd_estimate: 0.10

# ROUNDTRIP PROBE: Lower sizes for better LP viability
paper_size_usd: 100  # REDUCED from 250 - lowers ticks_crossed
paper_slippage_bps: 5

# M4.2 USD-notional sizing (matches paper_size_usd)
target_usd_notional: 100  # REDUCED from 250 - smaller notional
use_usd_notional: true
tokens_usd_price:
  WBTC: 68000
  WETH: 2050
  ETH: 2050
  USDC: 1.0
  USDT: 1.0
  DAI: 1.0
  ARB: 0.10
  LINK: 16.0
  wstETH: 2500

# Autosize configuration
autosize:
  enabled: true
  base_size_usd: 500   # Lower base for probe
  min_size_usd: 50     # Lower floor
  max_size_usd: 2000   # Lower ceiling
  impact_threshold_bps: 50
  ticks_crossed_threshold: 5
  reduction_factor: 0.5
  cooldown_seconds: 300
  reason_codes:
    - "high_impact"
    - "ticks_crossed"
    - "volatility"
    - "cooldown_active"

# ROUNDTRIP PROBE: Lower min_spread_bps to catch more signals
min_spread_bps: 5  # REDUCED from 10 - catches more signals for viability testing

# Net PnL threshold
min_net_pnl_usdc_est: 0.0

# v2.2.0: truth_mode_m42 - roundtrip is canonical
truth_mode_m42: true

# v2.2.0: QuoterV2 for executable pricing
use_quoter_v2: true

# Discovery settings
discovery_dry_run: true
discovery_runtime: false
discovery_runtime_max_pairs: 20

# Cross-DEX requirement
require_cross_dex: true

# M4 markers - execution disabled
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4
