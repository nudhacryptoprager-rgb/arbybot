# PATH: config/real_roundtrip_probe.yaml
#
# M4.2 ROUNDTRIP PROBE CONFIG (v3.2.14)
#
# PURPOSE: Achieve profit_truth_available=true (is_roundtrip_viable=true for >= 1 signal)
# 
# KEY DIFFERENCES FROM real_minimal.yaml:
# - Lower paper_size_usd (100) - reduces ticks_crossed for better LP viability
# - Lower min_spread_bps (5) - catches more signals
# - Focus on highest-liquidity STRICT cross-DEX pairs only
# - Smaller target_usd_notional (100) - matches paper_size_usd
#
# M4.2 TRUTH-PROGRESS CRITERIA (primary - must pass):
# 1. roundtrip_lp_filter.passed_to_roundtrip >= 1
# 2. roundtrip.evaluated_count >= 1
#
# QUALITY/STRETCH CRITERIA (secondary - nice to have):
# 3. window_chain_key != MIXED (arbitrum_one only)
# 4. agg_status = PASS
# 5. unique_pairs >= 8
#
# Usage: py -3.11 scripts/ci_m5_0_gate.py --online --config config/real_roundtrip_probe.yaml

# v3.2.14: Explicit run_kind for predictable rolling updates
run_kind: NORMAL

# Chain: Arbitrum One ONLY (avoid MIXED rolling window)
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage
dexes:
  - uniswap_v3
  - sushiswap_v3

# HIGHEST-LIQUIDITY CROSS-DEX PAIRS ONLY
# Selected for LP viability (lowest ticks_crossed, highest liquidity)
pairs:
  # WETH/USDC - highest liquidity on both DEXes
  - token_in: WETH
    token_out: USDC
    fee_tiers: [100, 500]
  # WETH/USDT - high liquidity
  - token_in: WETH
    token_out: USDT
    fee_tiers: [500]
  # WBTC/WETH - high liq cross-DEX
  - token_in: WBTC
    token_out: WETH
    fee_tiers: [500, 3000]
  # ARB/WETH - cross-DEX viable
  - token_in: ARB
    token_out: WETH
    fee_tiers: [500, 3000]
  # LINK/WETH - cross-DEX (fee=3000)
  - token_in: LINK
    token_out: WETH
    fee_tiers: [3000]
  # wstETH/WETH - LST pair, high liq
  - token_in: wstETH
    token_out: WETH
    fee_tiers: [100, 500]
  # WBTC/USDC - cross-DEX (fee=500)
  - token_in: WBTC
    token_out: USDC
    fee_tiers: [500]
  # v3.2.14: WETH/DAI REMOVED - Sushi pool disabled (PRICE_SANITY_FAILED), no cross-DEX
  # with require_cross_dex=true this pair would generate 0 signals (false expectation)
  # RESTORE WHEN: sushiswap_v3_WETH_DAI_* re-enabled

