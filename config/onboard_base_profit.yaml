# PATH: config/onboard_base_profit.yaml
#
# BASE PROFIT LANE — narrow contour for profit convergence
#
# STATUS: 4 executable DEXes (uniswap_v3, sushiswap_v3, pancakeswap_v3, aerodrome).
# R39n: Extracted from onboard_base_stage2.yaml. Focus: 6 profit-relevant pairs,
# narrow sweep corridor [25..250], merged anchor block.
#
# ADAPTER READINESS:
#   uniswap_v3 → UniswapV3Adapter: PRODUCTION
#   sushiswap_v3 → UniswapV3Adapter: PRODUCTION
#   pancakeswap_v3 → UniswapV3Adapter: PRODUCTION
#   aerodrome → Ve33Adapter: PRODUCTION (R27.4)
#
# PURPOSE: Base profit-lane convergence. Alpha pairs (cbBTC, AERO) + calibration.
# RUN_KIND: COVERAGE
#
# WORKFLOW:
#   py -3.11 start.py --config-list config/real_minimal.yaml,config/onboard_base_profit.yaml --minutes 10 --cycles 1

chain: base
chain_id: 8453

run_kind: COVERAGE

# R39p: More RPCs to spread rate-limit surface. First two have better
# quoter throughput than mainnet.base.org (which 429s aggressively).
rpc_endpoints:
  - "https://base.drpc.org"
  - "https://base.publicnode.com"
  - "https://mainnet.base.org"
  - "https://base.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

dexes:
  - uniswap_v3
  - sushiswap_v3
  - pancakeswap_v3
  - aerodrome

# R39n: Narrow discovery to profit-relevant pairs only
discovery_runtime_max_pairs: 15
require_cross_dex: true

# R39n: Profit lane — only these 6 pairs
include_pairs:
  - "cbBTC/USDC"
  - "cbBTC/WETH"
  - "AERO/USDC"
  - "WETH/USDC"
  - "USDC/DAI"
  - "USDC/USDT"

# R28.27: Exclude known-dead/stale pairs on base
excluded_pair_hints:
  - "BRETT/*"
  - "DEGEN/*"
  - "TOSHI/*"
  - "*/BRETT"
  - "*/DEGEN"
  - "*/TOSHI"

# R39p: Quarantine all failing Aerodrome ve33 pools (VE33_QUOTE_FAILED).
# Original 3 from R39o + 4 more from fresh reject_histogram (WETH/USDC, USDC/DAI).
excluded_pool_addresses:
  - "0x7f670f78b17dec44d5ef68a48740b6f8849cc2e6"
  - "0x80abe24a3ef1fc593ac5da960f232ca23b2069d0"
  - "0x2578365b3dfa7ffe60108e181efb79feddec2319"
  - "0x4f5f4b7381b2445937dab831fc1952ecbb834e53"
  - "0x67b00b46fa4f4f24c03855c5c8013c0b938b3eec"
  - "0xcdac0d6c6c59727a65f871236188350531885c43"
  - "0x3548029694fbb241d45fb24ba0cd9c9d4e745f16"

roundtrip_max_candidates: 50
roundtrip_top_n: 15

# R39p: Reserved slots — only pairs with proven executable throughput.
# cbBTC/* removed until they achieve >=1 executable quote per run.
reserved_candidate_slots:
  - pair_pattern: "WETH/USDC"
    min_slots: 1
  - pair_pattern: "AERO/USDC"
    min_slots: 1

use_multicall: true
use_quoter_v2: true

use_usd_notional: true
discovery_probe_size_usd: 10
target_usd_notional: 50.0

min_spread_bps: 5
paper_size_usd: 50
paper_slippage_bps: 5
gas_usd_estimate: 0.05

# R39o: Tight sweep corridor aligned to $50 frontier — no RPC budget above $100
dynamic_probe:
  enabled: true
  sizes_usd: [25, 50, 75, 100]
  top_routes: 15

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  cbBTC: 68000.0
  USDC: 1.0
  USDbC: 1.0
  USDT: 1.0
  DAI: 1.0
  cbETH: 2200.0
  AERO: 0.50

# R39n: Single merged anchor block (fixes R39m duplicate YAML key issue)
tokens_anchor_price:
  cbBTC_USDC: 68000.0
  cbBTC_WETH: 33.0
  AERO_USDC: 0.50
  WETH_USDC: 2050.0
  WETH_USDbC: 2050.0
  USDC_USDT: 1.0
  USDC_DAI: 1.0
