# PATH: config/onboard_base_profit.yaml
#
# BASE PROFIT LANE — narrow contour for profit convergence
#
# STATUS: 4 executable DEXes (uniswap_v3, sushiswap_v3, pancakeswap_v3, aerodrome).
# R39n: Extracted from onboard_base_stage2.yaml. Focus: 6 profit-relevant pairs,
# narrow sweep corridor [25..250], merged anchor block.
#
# ADAPTER READINESS:
#   uniswap_v3 → UniswapV3Adapter: PRODUCTION
#   sushiswap_v3 → UniswapV3Adapter: PRODUCTION
#   pancakeswap_v3 → UniswapV3Adapter: PRODUCTION
#   aerodrome → Ve33Adapter: PRODUCTION (R27.4)
#
# PURPOSE: Base profit-lane convergence. Alpha pairs (cbBTC, AERO, VIRTUAL) + calibration.
# RUN_KIND: COVERAGE
#
# R39r CONTOUR LOCK: USDC/DAI and USDC/USTT are the primary profit routes.
# WETH/USDC is benchmark/diagnostic ONLY (cost-filtered at 60 bps > 30 max).
# DO NOT expand contour until executable truth proven (real_quote_count > 0).
#
# BLOCKER: Not generic RPC — missing Flashblocks/preconf execution edge.
# Next step: integrate Flashblocks read-path, then fast submit-path.
#
# WORKFLOW:
#   py -3.11 start.py --config-list config/real_minimal.yaml,config/onboard_base_profit.yaml --minutes 10 --cycles 1

chain: base
chain_id: 8453

run_kind: COVERAGE

# R39p: More RPCs to spread rate-limit surface. First two have better
# quoter throughput than mainnet.base.org (which 429s aggressively).
# R39r++ step 2: Alchemy Base as primary RPC for generic quality uplift.
# Uses ${ALCHEMY_API_KEY} from .env; silently skipped if key missing.
rpc_endpoints:
  - "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
  - "https://base.drpc.org"
  - "https://base.publicnode.com"
  - "https://mainnet.base.org"
  - "https://base.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# R39r: Flashblocks read-path (public, rate-limited — NOT for production submit).
# Provides pending state, sub-block (~200ms) events, eth_simulateV1.
# Reference: https://docs.base.org/base-chain/flashblocks/api-reference
# Lead step 4: Public endpoints rate-limited, not for production traffic.
# R40.1: Corrected Flashblocks endpoints per Base docs (2026-04-15).
# Old: base.flashblocks.base.org (DNS failure). New: mainnet-preconf.base.org.
# Ref: https://docs.base.org/base-chain/api-reference/rpc-overview
flashblocks_ws_endpoint: "wss://mainnet-preconf.base.org"
flashblocks_http_endpoint: "https://mainnet-preconf.base.org"

universe_source: discovery_runtime

# R40: The Graph API pool discovery — supplements intent.txt with
# high-TVL pools discovered via subgraph queries (Uniswap V3 + Aerodrome).
# Free tier: 100k queries/day. Set GRAPH_API_KEY env for decentralized network.
graph_discovery:
  enabled: true
  min_tvl_usd: 50000
  max_pools: 30

dexes:
  - uniswap_v3
  - sushiswap_v3
  - pancakeswap_v3
  - aerodrome

# R39n: Narrow discovery to profit-relevant pairs only
discovery_runtime_max_pairs: 15
require_cross_dex: true

# R39q: Profit lane pairs — cheap fee/size routes first, expensive diagnostic last.
# Lead review R39p step 2-3: stop WETH/USDC from eating alpha budget.
#
# R40: Expanded contour — alpha pairs re-enabled + VIRTUAL added.
# cbBTC is volatile + high TVL on Base → cross-dex arb opportunity.
# VIRTUAL is Base-native high-TVL token with Uniswap V3 + Aerodrome pools.
include_pairs:
  - "USDC/DAI"       # PRIMARY — gap ~2 bps, stablecoin arb
  - "USDC/USDT"      # PRIMARY — gap ~3 bps, stablecoin arb
  - "WETH/USDC"      # BENCHMARK — lp_fee=101 bps roundtrip, diagnostic only
  - "AERO/USDC"      # ALPHA — Aerodrome native, high TVL, volatile
  - "cbBTC/USDC"     # ALPHA — Coinbase BTC, high TVL, volatile
  - "cbBTC/WETH"     # ALPHA — cbBTC/WETH cross-dex route
  - "VIRTUAL/USDC"   # ALPHA — Base-native, high TVL, volatile

# R28.27: Exclude known-dead/stale pairs on base
excluded_pair_hints:
  - "BRETT/*"
  - "DEGEN/*"
  - "TOSHI/*"
  - "*/BRETT"
  - "*/DEGEN"
  - "*/TOSHI"

# R39p: Quarantine all failing Aerodrome ve33 pools (VE33_QUOTE_FAILED).
# Original 3 from R39o + 4 more from fresh reject_histogram (WETH/USDC, USDC/DAI).
excluded_pool_addresses:
  - "0x7f670f78b17dec44d5ef68a48740b6f8849cc2e6"
  - "0x80abe24a3ef1fc593ac5da960f232ca23b2069d0"
  - "0x2578365b3dfa7ffe60108e181efb79feddec2319"
  - "0x4f5f4b7381b2445937dab831fc1952ecbb834e53"
  - "0x67b00b46fa4f4f24c03855c5c8013c0b938b3eec"
  - "0xcdac0d6c6c59727a65f871236188350531885c43"
  - "0x3548029694fbb241d45fb24ba0cd9c9d4e745f16"

roundtrip_max_candidates: 50
roundtrip_top_n: 15

# R39q: Pre-RT cost filter (lead step 4).
# Routes with lp_fee_roundtrip > 30 bps or measured_slippage > 150 bps
# are demoted to diagnostic-only and never enter truth lane.
roundtrip_lp_fee_max_bps: 30
roundtrip_slippage_max_bps: 150

# R39q: Reserved slots — only cheap-fee pairs with proven executable throughput.
# WETH/USDC removed: lp_fee=101 bps roundtrip, measured_slippage up to 981 bps @ $25.
# cbBTC/* and AERO/USDC removed: alpha thesis unproven at runtime. They compete
# on spread_minus_required_bps like all other pairs — no guaranteed budget until
# they demonstrate real_quote_count > 0 for 3+ consecutive cycles.
# It stays in include_pairs for diagnostic visibility but loses guaranteed budget.
#
# R39r+ EXPANSION POLICY: Do NOT add new pairs or pools until executable truth
# is proven (real_quote_count > 0, roundtrip_evaluated > 0) on existing contour.
# New pool only if it strengthens USDC/USDT or USDC/DAI throughput.
reserved_candidate_slots:
  - pair_pattern: "USDC/DAI"
    min_slots: 1
  - pair_pattern: "USDC/USDT"
    min_slots: 1

use_multicall: true
use_quoter_v2: true

use_usd_notional: true
discovery_probe_size_usd: 10
target_usd_notional: 50.0

min_spread_bps: 5
paper_size_usd: 50
paper_slippage_bps: 5
gas_usd_estimate: 0.05

# R40: Wide sweep corridor — use full canonical ladder for dynamic sizing.
# Adaptive refinement in sweep_roundtrip_sizes finds the local optimum.
dynamic_probe:
  enabled: true
  sizes_usd: [5, 10, 25, 50, 75, 100, 150, 250, 500, 750, 1000]
  top_routes: 15
  adaptive_refinement: true

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

tokens_usd_price:
  WETH: 2322.0
  WBTC: 68000.0
  cbBTC: 68000.0
  USDC: 1.0
  USDbC: 1.0
  USDT: 1.0
  DAI: 1.0
  cbETH: 2200.0
  AERO: 0.36
  VIRTUAL: 1.50

# R39n: Single merged anchor block (fixes R39m duplicate YAML key issue)
tokens_anchor_price:
  cbBTC_USDC: 68000.0
  cbBTC_WETH: 33.0
  AERO_USDC: 0.36
  WETH_USDC: 2322.0
  VIRTUAL_USDC: 1.50
  WETH_USDbC: 2322.0
  USDC_USDT: 1.0
  USDC_DAI: 1.0
