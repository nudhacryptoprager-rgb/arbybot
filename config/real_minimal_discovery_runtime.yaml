# PATH: config/real_minimal_discovery_runtime.yaml
#
# M4+ REAL Pipeline - Discovery Runtime Test Config
#
# Purpose: Test universe_source=discovery_runtime mode which:
# - Loads tokens from core_tokens.yaml (trust anchors)
# - Resolves pools dynamically from on-chain factories
# - Filters to only cross-DEX pairs (require_cross_dex=true)
# - Caps queries with ARBY_RESOLVER_MAX_RPC_CALLS (default: 50)
#
# This config demonstrates the "discovery_runtime" universe flow
# as an alternative to static pairs: [...] in YAML.

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage
dexes:
  - uniswap_v3
  - sushiswap_v3

# ========== DISCOVERY RUNTIME MODE ==========
# Instead of using static pairs, discover pools at runtime
universe_source: discovery_runtime

# Limit runtime pairs (prevents excessive RPC load)
discovery_runtime_max_pairs: 15

# Only include pairs with pools on multiple DEXes
# (filters out single-DEX pairs which cannot produce cross-DEX arb)
require_cross_dex: true

# Fail-fast: discovery must actually quote (not just metrics)
discovery_dry_run: false

# ========== STANDARD SETTINGS ==========

# Gas config (Arbitrum)
gas_price_gwei: 0.1
max_gas_price_gwei: 1.0
l2_gas_limit: 1000000

# Price sanity
price_sanity_max_deviation_bps: 5000

# M4 simulate_only (no real execution)
kill_switch_active: true
simulate_only: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4

# v2.2.0: truth_mode_m42 - roundtrip is canonical, one-leg is diagnostic only
truth_mode_m42: true

# v2.2.0: use_quoter_v2 enables QuoterV2 calls for executable pricing
use_quoter_v2: true

# Paper trading settings
paper_size_usd: 1000
paper_slippage_bps: 0

# Spread threshold
min_spread_bps: 5

# Token addresses (Arbitrum One) - flat format required by quotes.py
tokens:
  WETH: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
  USDC: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
  USDT: "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
  ARB: "0x912CE59144191C1204E64559FE8253a0e49E6548"
  DAI: "0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1"

# Token decimals for proper normalization
quote_decimals:
  WETH: 18
  USDC: 6
  USDT: 6
  ARB: 18
  DAI: 18

# Anchor prices for discovery_runtime tokens
tokens_anchor_price:
  WETH_USDC: 2500
  WETH_USDT: 2500
  WETH_DAI: 2500
  ARB_USDC: 0.50
  ARB_WETH: 0.0002
  ARB_DAI: 0.50
