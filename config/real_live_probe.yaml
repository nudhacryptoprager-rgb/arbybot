# PATH: config/real_live_probe.yaml
#
# R28.15 LIVE EXECUTION PROBE - Arbitrum One
#
# PURPOSE: Live execution config for M4.2 DoD proof.
# DO NOT USE until the full execution path is validated:
#   - PreTradeSimulator passes
#   - Gas price within bounds
#   - Slippage within bounds
#   - Signing infrastructure ready
#
# SAFETY:
#   - kill_switch_active: false (operator must enable manually)
#   - execution_enabled: true  (allows tx submission)
#   - max_position_usd: 10.0   (micro-position for initial testing)
#   - require_simulation: true  (must pass pre-trade sim)
#
# REQUIRED ENV:
#   ARBY_SIGNER_ADDRESS - EOA address for signing txs
#   ARBY_PRIVATE_KEY    - (via keystore, NOT plaintext)
#   ARBY_RPC_URL        - fast RPC with tx submission support
#

chain: arbitrum_one
chain_id: 42161

rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"

rpc_timeout_seconds: 8
rpc_retries: 2
rpc_backoff_base_ms: 300

# --- Execution flags ---
execution_enabled: true
kill_switch_active: false
simulate_only: false

# --- Execution safety bounds ---
max_gas_price_gwei: 50.0
max_slippage_bps: 100
require_simulation: true
receipt_timeout_seconds: 60
max_position_usd: 10.0

