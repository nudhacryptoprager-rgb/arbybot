# Quote sizing: 1 ETH
quote_amount_in_wei: "1000000000000000000"

# Gate thresholds
max_slippage_bps: 100
min_net_bps: 5

# STEP 6: Price sanity gate with M4 BOOTSTRAP thresholds
# Anchor: WETH/USDC expected ~3500 USD (canonical)
# Bounds: [1500, 6000] - absolute limits
# M4 Bootstrap: 50% deviation allowed (will tighten in M5)
price_sanity_enabled: true
price_sanity_max_deviation_bps: 5000  # 50% for bootstrap

# Paper trading
cooldown_seconds: 60
notion_capital_usdc: "10000.000000"

# M5 Cost model (gas-only)
gas_usd_estimate: 0.10

# Paper trading settings (M5)
paper_size_usd: 1000
paper_slippage_bps: 0  # 0 bps default - conservative for micro-spreads

# Autosize configuration (M5)
# Auto-reduces position size when impact/ticksCrossed grows
autosize:
  enabled: true
  base_size_usd: 1000           # Starting position size
  min_size_usd: 100             # Floor - never go below this
  max_size_usd: 5000            # Ceiling - never exceed this
  impact_threshold_bps: 50      # Reduce size if impact > 50 bps
  ticks_crossed_threshold: 5    # Reduce size if ticksCrossed > 5
  reduction_factor: 0.5         # Reduce by 50% per threshold breach
  cooldown_seconds: 300         # Wait 5 min before re-adjusting
  reason_codes:
    - "high_impact"             # impact_bps > threshold
    - "ticks_crossed"           # ticksCrossed > threshold
    - "volatility"              # price moved > X% in window
    - "cooldown_active"         # within cooldown period

# Spread signal threshold (M5)
# Signals with spread_bps_exact < this are filtered out
# Production: 5 bps minimum (filters micro-spreads that can't cover gas)
# Debug: 0 = any positive spread
min_spread_bps: 5  # 5 bps = production threshold

# Net PnL threshold for daily_report top_opportunities (M5)
# Signals with net_pnl_usdc_est < this are excluded from top_opportunities
# 0 = break-even or better (opportunity must cover costs)
min_net_pnl_usdc_est: 0.0  # 0 = break-even or better

# v2.2.0: truth_mode_m42 - roundtrip is canonical, one-leg is diagnostic only
# This ensures profit calculations use proper two-leg roundtrip semantics
truth_mode_m42: true

# v2.2.0: use_quoter_v2 enables QuoterV2 calls for executable pricing
# Required for truth_mode_m42 to produce executable quotes
use_quoter_v2: true

# M4 markers - execution disabled
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4
