# PATH: config/coverage_intent_base.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (Base)
#
# CHAIN QUALITY STATUS (2026-03-10 session 3):
#   Classification: TOP_PAIR_DOMINANCE_HIGH (WETH/USDC 93% of net share)
#   Evidence: runDir 121237 - 10 signals, 7 included (4 WETH/USDC dominate)
#   Root cause: wstETH/rETH missing from core_tokens.yaml → pairs_skipped_no_tokens=2
#   Fix (session 3): Added wstETH + rETH to config/core_tokens.yaml base section.
#        Discovery now resolves wstETH/WETH and rETH/WETH via factory.getPool().
#        Cross-DEX pools (UNI+SUSHI+PCSWAP) should add 2+ non-WETH/USDC signals.
#   Target: top_pair_share < 0.80 (was 0.93)
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline on Base.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_base.yaml --cycles 1
#
# v3.2.31: Initial config for Base multi-chain bring-up

# Chain: Base
chain: base
chain_id: 8453

# RPC endpoints with fallback
rpc_endpoints:
  - "https://mainnet.base.org"
  - "https://base.public.blastapi.io"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
# v3.2.17: Enables factory.getPool() discovery via resolve_runtime_pairs()
universe_source: discovery_runtime

# DEXes to scan (must have factory addresses in dexes.yaml)
# v3.2.56: Only quoter_v2-compatible DEXes for M4.2 compliance
# NOTE: aerodrome (ve33) excluded - getAmountOut source, causes MIXED_SOURCE
# v3.2.70: pancakeswap_v3 re-added (quoter_v2-compatible, 3 cross-DEX routes)
dexes:
  - uniswap_v3
  - sushiswap_v3
  - pancakeswap_v3

# Discovery settings
discovery_runtime_max_pairs: 30  # v3.2.56: Increased from 20 for better sample size
require_cross_dex: true  # Enforce cross-DEX pairs (UniswapV3 <-> SushiSwap)

# Multicall batching (default ON)
use_multicall: true

# v3.2.37: Use QuoterV2 for executable pricing (better quote quality)
use_quoter_v2: true

# USD-notional sizing (M4.2)
use_usd_notional: true
target_usd_notional: 100.0

# Spread economics
# v3.2.50: min_spread_bps lowered from 5 to 3 for better signal capture
# Rationale: Base gas_usd_estimate=0.01 means 3bps spread is highly profitable
min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.01  # Base is very cheap (L2)

# Token USD prices (for notional sizing)
# All tokens from config/core_tokens.yaml for base chain
# v3.2.50: Updated AERO price from 1.5 to 0.35 (market correction)
tokens_usd_price:
  WETH: 2050.0       # on-chain ~2050 (2026-03-10, aligned with real_minimal.yaml)
  USDC: 1.0
  USDT: 1.0
  DAI: 1.0
  cbETH: 2200.0      # ~1.07x WETH
  cbBTC: 68000.0     # aligned with WBTC in real_minimal.yaml
  AERO: 0.35
  BRETT: 0.15
  DEGEN: 0.01
  TOSHI: 0.0003
  wstETH: 2500.0     # v3.2.72: ~1.22x WETH (Lido bridged to Base)
  rETH: 2300.0       # v3.2.72: ~1.12x WETH (Rocketpool bridged to Base)
  # VIRTUAL: removed — thin liquidity, produces fragile signals (fragile_rate=0.60)
  # WELL: removed — thin liquidity (drift 95.6%), no stable quotes

# Price anchor overrides (v3.2.24)
# For pairs that need explicit anchor instead of computed WETH/USDC
tokens_anchor_price:
  WETH_USDC: 2050.0    # aligned with tokens_usd_price
  cbETH_WETH: 1.07
  cbBTC_WETH: 33.2     # 68000/2050
  wstETH_WETH: 1.22    # v3.2.72: ~1.22 WETH per wstETH
  rETH_WETH: 1.12      # v3.2.72: ~1.12 WETH per rETH

# Pair exclusions: thin-liquidity tokens producing fragile/suspect signals
# v3.2.70: VIRTUAL/WELL removed — fragile source (runDir 095028 evidence)
# R12: cbBTC/* added — WETH/cbBTC produces spurious profitability (>500 bps outlier)
#   Runtime SUSPECT_ROUNDTRIP_OUTLIER filter catches it, but explicit exclusion
#   prevents it from polluting frontier ranking and inflating signal counts.
excluded_pair_hints:
  - "VIRTUAL/*"   # Fragile: thin liquidity, causes fragile_rate>0.50
  - "WELL/*"      # Thin: 95.6% drift, no stable quotes
  - "cbBTC/*"     # R12: Spurious profitability (>500 bps outlier)
  - "*/cbBTC"     # R12: Also exclude reverse direction

# Price sanity gates (relaxed for bootstrap)
price_sanity_max_deviation_bps: 10000

# Drift tolerance (relaxed for bootstrap)
drift_warning_pct: 30.0

# R17: Dynamic sweep for measured economics frontier (all-chain)
# Uses smaller sizes than real_minimal since this is coverage mode
dynamic_probe:
  enabled: true
  sizes_usd: [25, 50, 75, 100]
  top_routes: 2

# Run settings
run_kind: COVERAGE
