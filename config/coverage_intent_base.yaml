# PATH: config/coverage_intent_base.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (Base)
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline on Base.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_base.yaml --cycles 1
#
# v3.2.31: Initial config for Base multi-chain bring-up

# Chain: Base
chain: base
chain_id: 8453

# RPC endpoints with fallback
rpc_endpoints:
  - "https://mainnet.base.org"
  - "https://base.public.blastapi.io"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
# v3.2.17: Enables factory.getPool() discovery via resolve_runtime_pairs()
universe_source: discovery_runtime

# DEXes to scan (must have factory addresses in dexes.yaml)
# v3.2.56: Only quoter_v2-compatible DEXes for M4.2 compliance
# NOTE: aerodrome (ve33) excluded - getAmountOut source, causes MIXED_SOURCE
# NOTE: pancakeswap_v3 excluded - pool slot0 calls failing (low/no liquidity)
dexes:
  - uniswap_v3
  - sushiswap_v3

# Discovery settings
discovery_runtime_max_pairs: 30  # v3.2.56: Increased from 20 for better sample size
require_cross_dex: true  # Enforce cross-DEX pairs (UniswapV3 <-> SushiSwap)

# Multicall batching (default ON)
use_multicall: true

# v3.2.37: Use QuoterV2 for executable pricing (better quote quality)
use_quoter_v2: true

# USD-notional sizing (M4.2)
use_usd_notional: true
target_usd_notional: 100.0

# Spread economics
# v3.2.50: min_spread_bps lowered from 5 to 3 for better signal capture
# Rationale: Base gas_usd_estimate=0.01 means 3bps spread is highly profitable
min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.01  # Base is very cheap (L2)

# Token USD prices (for notional sizing)
# All tokens from config/core_tokens.yaml for base chain
# v3.2.50: Updated AERO price from 1.5 to 0.35 (market correction)
tokens_usd_price:
  WETH: 3000.0
  USDC: 1.0
  USDT: 1.0
  DAI: 1.0
  cbETH: 3200.0  # Premium over ETH
  cbBTC: 60000.0
  AERO: 0.35     # Updated from 1.5 (market correction)
  BRETT: 0.15
  DEGEN: 0.01
  TOSHI: 0.0003
  VIRTUAL: 3.0
  WELL: 0.15

# Price anchor overrides (v3.2.24)
# For pairs that need explicit anchor instead of computed WETH/USDC
tokens_anchor_price:
  WETH_USDC: 3000.0
  cbETH_WETH: 1.07
  cbBTC_WETH: 20.0

# Price sanity gates (relaxed for bootstrap)
price_sanity_max_deviation_bps: 10000

# Drift tolerance (relaxed for bootstrap)
drift_warning_pct: 30.0

# Run settings
run_kind: COVERAGE
