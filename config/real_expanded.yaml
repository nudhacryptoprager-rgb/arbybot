paper_slippage_bps: 0

# Autosize configuration (M5)
autosize:
  enabled: true
  base_size_usd: 1000
  min_size_usd: 100
  max_size_usd: 5000
  impact_threshold_bps: 50
  ticks_crossed_threshold: 5
  reduction_factor: 0.5
  cooldown_seconds: 300
  reason_codes:
    - "high_impact"
    - "ticks_crossed"
    - "volatility"
    - "cooldown_active"

# Spread signal threshold (M5)
min_spread_bps: 5

# Net PnL threshold for daily_report top_opportunities (M5)
min_net_pnl_usdc_est: 0.0

# M4 markers - execution disabled
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4

# =============================================================================
# M4.2 QUOTE CONFIGURATION (v2.0.9+)
# =============================================================================

# M4.2 Truth Mode (v2.1.0)
# When true: CANONICAL profit = round-trip with real leg2 re-quote
#   - Opportunities require BOTH legs quote_source=quoter_v2
#   - Round-trip must have leg2_is_real_quote=true for canonical
#   - Slot0/mixed-source opportunities = DIAGNOSTIC ONLY (excluded from M4 signals)
# When false: Legacy M4.1 mode, one-leg spread = profit (paper simulation)
truth_mode_m42: true

# QuoterV2 integration (feature flag)
# When true: use on-chain quoters for executable amounts (replaces slot0 spot price)
# When false: use slot0 for spot price estimation only
# IMPORTANT: Algebra-based DEXes (camelot_v3) REQUIRE use_quoter_v2=true
use_quoter_v2: true  # M4.2: Required for camelot_v3 (Algebra ABI)

# USD-notional sizing (M4.2)
# When true: all quotes use consistent USD notional (e.g., $1000) for fair comparison
# When false: legacy mode, uses 1 token regardless of value
use_usd_notional: true

# Target USD notional for quote sizing (when use_usd_notional=true)
target_usd_notional: 1000.0

# Token USD prices for sizing (optional override, defaults in strategy/quotes.py)
# Format: TOKEN_SYMBOL: usd_price
tokens_usd_price:
  WETH: 2000.0
  WBTC: 34000.0
  ARB: 0.70
  LINK: 11.0
  GMX: 24.0
  wstETH: 2300.0
  # Stables default to $1.0

# Legacy field - no longer used when use_usd_notional=true
# quote_amount_in_wei: "1000000000000000000"

# =============================================================================
# L1 GAS COST MODEL (v2.1.0)
# =============================================================================
# Arbitrum/Optimism L1 data posting overhead
# NOTE: These are configurable so we can tune without code changes
# For live L1 gas oracle integration, set l1_gas_oracle: true (future)

# L1 calldata units (compression factor applied to typical swap tx)
# Default: 2000 units (conservative for ~300 bytes of calldata after compression)
l1_data_gas_units: 2000

# L1 gas price in gwei (mainnet gas price for data posting)
# Default: 30 gwei (moderate congestion)
# When Ethereum L1 is congested (>50 gwei), update this to reflect actual cost
l1_gas_price_gwei: 30.0

# Future: Enable live L1 gas oracle (NodeInterface.gasEstimateL1Component on Arbitrum)
# l1_gas_oracle: false
