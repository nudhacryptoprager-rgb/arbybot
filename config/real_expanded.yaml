# PATH: config/real_expanded.yaml
#
# M4 REAL Pipeline - EXPANDED CONFIG (Diversity Targets)
#
# PURPOSE: Reach DIVERSITY targets (unique_pairs >= 10, unique_routes >= 4)
# BASED ON: config/real_minimal.yaml (v2.0.1)
#
# Diversity Plan:
# - Pairs: 10+ unique pairs from different categories
# - Routes: 4+ unique routes (uniswap_v3<->sushiswap_v3, both directions, + fee tiers)
# - Categories: majors (WETH pairs), stables (USDC/USDT cross), alts (ARB, LINK, GMX)
#
# Note: This config is for diversity expansion.
# Pool addresses must be verified before adding new pairs.

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage 
# NOTE: camelot_v3 disabled - Algebra quoter requires different ABI (TODO: M4.3)
dexes:
  - uniswap_v3
  - sushiswap_v3
  # - camelot_v3  # Disabled: Algebra quoter signature differs from standard

# EXPANDED PAIRS (verified pools only - safe-by-default)
# NOTE: Pairs without verified pools are COMMENTED OUT until verification.
# To enable a pair: 1) verify pools via factory.getPool() 2) add to pools section 3) uncomment
pairs:
  # === MAJORS (WETH pairs) - VERIFIED ===
  - token_in: WETH
    token_out: USDC
    fee_tiers: [500, 3000]
  - token_in: WETH
    token_out: USDT
    fee_tiers: [500, 3000]
  - token_in: wstETH
    token_out: WETH
    fee_tiers: [100, 500]
  # === ALTS (WETH pairs) - VERIFIED ===
  - token_in: ARB
    token_out: WETH
    fee_tiers: [500, 3000]
  - token_in: LINK
    token_out: WETH
    fee_tiers: [500, 3000]
  - token_in: GMX
    token_out: WETH
    fee_tiers: [500, 3000]
  # === ARB/USDC - VERIFIED ===
  - token_in: ARB
    token_out: USDC
    fee_tiers: [500, 3000]
  # === LINK/USDC - VERIFIED (2026-02-13) ===
  # Pools: Uniswap V3 (500,3000), SushiSwap V3 (3000)
  # v2.0.8: fee=500 pools may be empty/dead - restrict to 3000 only
  - token_in: LINK
    token_out: USDC
    fee_tiers: [3000]  # v2.0.8: 500 pool has QUOTE_ZERO_OUT
  # === ARB/USDT - VERIFIED (2026-02-13) ===
  # Pools: Uniswap V3 (500,3000), SushiSwap V3 (500,3000)
  - token_in: ARB
    token_out: USDT
    fee_tiers: [500, 3000]
  # === GMX/USDC - VERIFIED (2026-02-14) ===
  # Added for DIVERSITY_PAIRS >= 10 requirement
  - token_in: GMX
    token_out: USDC
    fee_tiers: [3000]
  # === TODO: Pairs below need both DEX pools for cross-dex arb ===
  # - token_in: LINK
  #   token_out: USDT
  #   fee_tiers: [500, 3000]
