# PATH: config/onboard_zksync_candidate.yaml
#
# ONBOARDING: zksync → CANDIDATE for promotion to NORMAL
#
# STATUS: Frontier #1 (gap_to_zero=0.0 bps), but drift_rejection_rate_median=0.3077.
# Must reduce drift below 0.25 before promotion.
# R28.27: Added excluded_pair_hints for ZK/HOLD pairs (always PRICE_SANITY_FAILED).
# Surface expansion: SyncSwap (non-V3 adapter) and SpaceFi are candidates but
# require new adapter work. Current 2-DEX (uni+pcswap) is the V3-compatible ceiling.
#
# ADAPTER READINESS:
#   uniswap_v3 → UniswapV3Adapter: PRODUCTION
#   pancakeswap_v3 → UniswapV3Adapter: PRODUCTION
#
# PURPOSE: Full 2-DEX universe with production thresholds, COVERAGE mode.
# Promotion criteria: drift_rejection_rate_median < 0.25, 5 consecutive PASS.
# RUN_KIND: COVERAGE
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_zksync_candidate.yaml --cycles 3

chain: zksync
chain_id: 324

run_kind: COVERAGE

rpc_endpoints:
  - "https://mainnet.era.zksync.io"
  - "https://zksync.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

# R36: +syncswap +iziswap — adapters implemented, dexes.yaml entries present for zksync
dexes:
  - uniswap_v3
  - pancakeswap_v3
  - syncswap
  - iziswap

discovery_runtime_max_pairs: 30
require_cross_dex: true

# R28.27: Exclude known-bad pairs
# HOLD/* consistently LIQUIDITY_ZERO, no anchor
# R39h: ZK/* blanket exclude removed — intent.txt declares ZK/USDC and ZK/WETH,
# and tokens_usd_price + tokens_anchor_price now cover ZK. Original R28.27 failure
# was PRICE_SANITY_FAILED due to missing anchor, not intrinsic lack of liquidity.
excluded_pair_hints:
  - "HOLD/*"
  - "*/HOLD"

# R28.25: Roundtrip evaluation caps (aligned with primary)
roundtrip_max_candidates: 50
roundtrip_top_n: 15

use_multicall: true
use_quoter_v2: true

# R28.25: Aligned with primary economics contract (was 100/3)
# R30: discovery_probe_size_usd decouples discovery from execution sizing
use_usd_notional: true
discovery_probe_size_usd: 10
target_usd_notional: 150.0

min_spread_bps: 5
paper_size_usd: 150
paper_slippage_bps: 5
gas_usd_estimate: 0.10

# R29: Wide size frontier (fixed-size doctrine removed)
dynamic_probe:
  enabled: true
  sizes_usd: [1, 2.5, 5, 10, 15, 25, 50, 75, 100, 150, 250, 500, 750, 1000, 1500, 2500, 5000, 7500, 10000]
  top_routes: 15

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDT: 1.0
  ZK: 0.10
  wstETH: 2500.0
  DAI: 1.0
  HOLD: 0.003

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WBTC_USDC: 68000.0
  USDC_USDT: 1.0
  USDC_DAI: 1.0
  ZK_USDC: 0.10
  ZK_WETH: 0.0000488
  wstETH_WETH: 1.22
