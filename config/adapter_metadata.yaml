      # -----------------------------------------------------------------------
      "0x1ab35116c3fa0b2f507d8c8c3261d42683c1e31e":
        pool_kind: "stable"
        coin_indices:
          USDbC: 0
          USDC: 1

      "0x35c6c59277f8fa9ae98dea29b0546d79957acdd8":
        pool_kind: "stable"
        coin_indices:
          USDC: 0
