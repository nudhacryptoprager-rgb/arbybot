# ---------------------------------------------------------------------------
# Balancer V2+
# ---------------------------------------------------------------------------
# Balancer uses a single Vault contract for all pools.
# Each pool registers with the Vault and receives a 32-byte pool_id.
# The first 20 bytes of pool_id are the pool address; the remaining bytes
# encode the pool nonce and specialization.
#
# pool_kind: "stable" | "weighted" | "crypto" | "linear"
# assets: list of token addresses in ascending address order (Balancer invariant).
#         Order MUST match on-chain (verify via Vault.getPoolTokens(pool_id)).

balancer:
  # Canonical Balancer V2 Vault — same address on all EVM chains where Balancer V2 is deployed.
  # This is a trust anchor: do not change without on-chain verification.
  vault_address: "0xba12222222228d8ba445958a75a0704d566bf2c8"
  graphql_url: "https://api-v3.balancer.fi/graphql"
  graphql_user_agent: "arby-m8-indexer/1.0"
  protocol_version_filter: [2]
  graphql_first: 80
  min_liquidity_usd: 500
  quote_smoke_sender: "0x000000000000000000000000000000000000dEaD"
  quote_smoke_recipient: "0x000000000000000000000000000000000000dEaD"
  quote_debug_artifact: "data/tmp/m9_balancer_quote_debug_latest.json"
  queries_address: "0xe39b5e3b6d74016b2f6a9673d7493b6df549d5"

  base:
    # BalancerQueries on Base (differs from Ethereum mainnet deployment).
    queries_address: "0x300ab2038eac391f26d9f895dc61f8f66a548833"
    pools:
      # -----------------------------------------------------------------------
      # Balancer pools on Base
      # Verify pool_id via: Vault.getPool(poolAddress) or Balancer subgraph
      # pool_id format: 0x<20-byte-pool-address><8-byte-nonce><4-byte-specialization>
      # = 0x + 64 hex chars total
      #
      # On-chain verification command (requires web3/cast):
      #   cast call 0xba12222222228d8ba445958a75a0704d566bf2c8 \
      #     "getPool(bytes32)(address,uint8)" <pool_id> --rpc-url <BASE_RPC>
      #
      # TODO: Balancer V2 has limited liquidity on Base compared to Aerodrome/UniV3.
      # Populate with pool_ids after on-chain verification. No real pool_ids added yet
      # because the Balancer API (api.balancer.fi/graphql) was unavailable at config time.
      # -----------------------------------------------------------------------
      # Example entry format (do not activate until pool_id verified on-chain):
      # "0x<pool_id_64_hex_chars_lowercase>":
      #   pool_kind: "stable"
      #   pool_address: "0x<first_20_bytes>"  # first 20 bytes of pool_id
      #   assets:
      #     - "0x<token_address_1_ascending>"
      #     - "0x<token_address_2_ascending>"

      # -----------------------------------------------------------------------
      # Balancer pools on Base — verified via api-v3.balancer.fi GraphQL 2026-05-29
      # All pools registered with Vault 0xba12222222228d8ba445958a75a0704d566bf2c8
      # pool_id format: 0x<20-byte-pool-address><8-byte-nonce><4-byte-spec> = 64 hex
      # assets order: ascending address (Balancer V2 invariant)
      #
      # Verify via: cast call 0xba12222222228d8ba445958a75a0704d566bf2c8 \
      #   "getPoolTokens(bytes32)(address[],uint256[],uint256)" <pool_id> --rpc-url <BASE_RPC>
      # -----------------------------------------------------------------------

      # OLAS / USDC — DISABLED: 100% QUOTE_REVERT rate in Run7+Run8 (2026-05-29)
      # Likely: pool_id mismatch or pool paused. Re-enable after on-chain verification.
      # "0x5332584890d6e415a6dc910254d6430b8aab7e69000200000000000000000103":
      #   pool_kind: "weighted"
      #   pool_address: "0x5332584890d6e415a6dc910254d6430b8aab7e69"
      #   assets:
      #     - "0x54330d28ca3357f294334bdc454a032e7f353416"  # OLAS
      #     - "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"  # USDC

      # WETH / IMO — DISABLED: 100% QUOTE_REVERT rate in Run7+Run8 (122 reverts, 2026-05-29)
      # Likely: pool_id mismatch or pool paused. Re-enable after on-chain verification.
      # "0x007bb7a4bfc214df06474e39142288e99540f2b3000200000000000000000191":
      #   pool_kind: "weighted"
      #   pool_address: "0x007bb7a4bfc214df06474e39142288e99540f2b3"
      #   assets:
      #     - "0x4200000000000000000000000000000000000006"  # WETH
      #     - "0x5a7a2bf9ffae199f088b25837dcd7e115cf8e1bb"  # IMO

      # AaveUSDC / GYD — GYROE, TVL ~$201k (2026-05-29)
      # pool_addr first 20 bytes: 0x79fe0750be76913e83a0f0eb60ba1ab7fa6fda5d
      # assets ascending: AaveUSDC(0x4ea7...) < GYD(0xca5d...)
      "0x79fe0750be76913e83a0f0eb60ba1ab7fa6fda5d00020000000000000000019f":
        pool_kind: "stable"
        pool_address: "0x79fe0750be76913e83a0f0eb60ba1ab7fa6fda5d"
        assets:
          - "0x4ea71a20e655794051d1ee8b6e4a3269b13ccacc"  # AaveUSDC
          - "0xca5d8f8a8d49439357d3cf46ca2e720702f132b8"  # GYD

      # WETH / USDC GyroE — verified via expansion handoff + queryBatchSwap RCA
      "0x97a3ece859d9c1c41e225fbd6f10359dae7a73c9000200000000000000000202":
        pool_kind: "gyroe"
        pool_address: "0x97a3ece859d9c1c41e225fbd6f10359dae7a73c9"
        assets:
          - "0x4200000000000000000000000000000000000006"  # WETH
          - "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"  # USDC

# ---------------------------------------------------------------------------
# Maverick V2
# ---------------------------------------------------------------------------
# Per-pool metadata for Maverick V2 directional-liquidity bins.
# token_a: the pool's tokenA address (lowercase).  Used to set tokenAIn=True/False
# correctly in PoolInformation.calculateSwap.  If not specified, the adapter
# falls back to a live tokenA() eth_call on the pool contract.
#
# token_a MUST be verified on-chain: cast call <pool_addr> "tokenA()(address)" --rpc-url <BASE_RPC>
#
# Adding pools:
#   1. Find the pool address via Maverick Factory.lookupPool(tokenA, tokenB, fee, tickSpacing).
#   2. Verify tokenA() on-chain.
#   3. Add entry below.
#   4. Add a unit test to verify token_a lookup.

maverick:
  base:
    pool_info_address: "0x67b70f73bee50ab48f0e8d75b94d4f6dced6ad72"  # PoolInformation
    quoter_address: "0xb40afdb85a07f37ae217e7d6462e609900dd8d7a"      # MaverickV2Quoter
    factory_address: "0x0a7e848aca42d879ef06507fca0e7b33a0a63c1e"   # Factory
    lookup_pair_end_index: 32
    lookup_max_focus_tokens: 60
    lookup_max_pairs: 150
    pool_created_event: "PoolCreated(address,uint8,uint256,uint256,uint256,uint256,int32,address,address,uint8,address)"
    factory_pagination_page_size: 50
    factory_pagination_max_pools: 200
    quote_debug_artifact: "data/tmp/m9_maverick_quote_debug_latest.json"
    log_lookback_blocks: 50000

    pools:
      # -----------------------------------------------------------------------
      # No pools pre-configured yet.
      # Pools discovered via M8 sniper will use live tokenA() lookup.
      # Add entries here after on-chain verification for RPC efficiency.
      # Example entry format:
      # "0x<pool_address>":
      #   token_a: "0x<token_a_address>"  # result of pool.tokenA()
      # -----------------------------------------------------------------------

