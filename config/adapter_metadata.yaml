# ---------------------------------------------------------------------------
# Balancer V2+
# ---------------------------------------------------------------------------
# Balancer uses a single Vault contract for all pools.
# Each pool registers with the Vault and receives a 32-byte pool_id.
# The first 20 bytes of pool_id are the pool address; the remaining bytes
# encode the pool nonce and specialization.
#
# pool_kind: "stable" | "weighted" | "crypto" | "linear"
# assets: list of token addresses in ascending address order (Balancer invariant).
#         Order MUST match on-chain (verify via Vault.getPoolTokens(pool_id)).

balancer:
  # Canonical Balancer V2 Vault — same address on all EVM chains where Balancer V2 is deployed.
  # This is a trust anchor: do not change without on-chain verification.
  vault_address: "0xba12222222228d8ba445958a75a0704d566bf2c8"

  base:
    pools:
      # -----------------------------------------------------------------------
      # Balancer pools on Base
      # Verify pool_id via: Vault.getPool(poolAddress) or Balancer subgraph
      # pool_id format: 0x<20-byte-pool-address><8-byte-nonce><4-byte-specialization>
      # = 0x + 64 hex chars total
      #
      # On-chain verification command (requires web3/cast):
      #   cast call 0xba12222222228d8ba445958a75a0704d566bf2c8 \
      #     "getPool(bytes32)(address,uint8)" <pool_id> --rpc-url <BASE_RPC>
      #
      # TODO: Balancer V2 has limited liquidity on Base compared to Aerodrome/UniV3.
      # Populate with pool_ids after on-chain verification. No real pool_ids added yet
      # because the Balancer API (api.balancer.fi/graphql) was unavailable at config time.
      # -----------------------------------------------------------------------
      # Example entry format (do not activate until pool_id verified on-chain):
      # "0x<pool_id_64_hex_chars_lowercase>":
      #   pool_kind: "stable"
      #   pool_address: "0x<first_20_bytes>"  # first 20 bytes of pool_id
      #   assets:
      #     - "0x<token_address_1_ascending>"
      #     - "0x<token_address_2_ascending>"
