      "0x385540fda649a114ffeb943fd73ae82ce7908da3":
        pool_kind: "stable"
        coin_indices:
          crvUSD: 0
          USDbC: 1

      "0x3a38e9b0b5cb034de01d5298fc2ed2d793c0c36f":
        pool_kind: "stable"
        coin_indices:
          USDC: 0
          USDbC: 1

      "0x3df1658e3e76d14ef3c4d410829ea7575bb83b9b":
        pool_kind: "stable"
        coin_indices:
          USDC: 0
