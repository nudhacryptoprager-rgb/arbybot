# PATH: config/real_hunting.yaml
#
# M4 REAL Pipeline - HUNTING CONFIG
#
# PURPOSE: Expand search surface with discovery_runtime
# - Uses factory.getPool() to discover cross-DEX pairs dynamically
# - Targets DIVERSITY_PAIRS_LOW fix (unique_pairs >= 8)
# - Does NOT modify real_minimal.yaml (hunting-only config)
#
# CREATED: 2026-02-27 (Roundtrip window analysis)
# Evidence: best_net_pnl_bps in window = -10.85 bps (close to 0)
# Goal: Find lower-impact pools or larger market dislocations
#
# USAGE:
#   py -3.11 -m strategy.jobs.run_scan --mode real --config config/real_hunting.yaml
#   py -3.11 start.py --config config/real_hunting.yaml --minutes 10 --max-runs 0 --cycles 1 --sleep-seconds 20 --prune-keep 200

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage
dexes:
  - uniswap_v3
  - sushiswap_v3

# NOTE: Pairs section used as FALLBACK when discovery_runtime fails
# Primary universe comes from discovery_runtime with factory.getPool()
pairs:
  # Major pairs with high liquidity on both DEXes
  - token_in: WETH
    token_out: USDC
    fee_tiers: [500, 3000]
  - token_in: WETH
    token_out: USDT
    fee_tiers: [500, 3000]
  - token_in: WBTC
    token_out: WETH
    fee_tiers: [500, 3000]
  - token_in: ARB
    token_out: WETH
    fee_tiers: [500, 3000]
  - token_in: LINK
    token_out: WETH
    fee_tiers: [500, 3000]
  - token_in: GMX
    token_out: WETH
    fee_tiers: [500, 3000]
  - token_in: wstETH
    token_out: WETH
    fee_tiers: [100, 500]
  - token_in: ARB
    token_out: USDC
    fee_tiers: [500, 3000]
  - token_in: WBTC
    token_out: USDC
    fee_tiers: [500, 3000]
  # NOTE: LINK/USDC removed - uniswap-only (no sushiswap pool), triggers SAME_DEX_EXCLUDED

# =============================================================================
# HUNTING CONFIG - CONFIG PAIRS (discovery_runtime disabled)
# =============================================================================
# discovery_runtime disabled due to finding toxic pairs with price issues
# (GRAIL/WETH, ARB/DAI, DPX/WETH with extreme notional drifts)
# Using static config pairs for stability
# =============================================================================
universe_source: config
discovery_runtime: false
# discovery_runtime_max_pairs: 50  # disabled

# v2.5.3: Cross-DEX preference - prefer cross-DEX spreads over same-DEX fee-tier arb
require_cross_dex: true

# =============================================================================
# SPREADS CONFIG (same as real_minimal.yaml)
# =============================================================================
# Quote sizing: 1 ETH
quote_amount_in_wei: "1000000000000000000"

# Gate thresholds
max_slippage_bps: 100
min_net_bps: 5

# Price sanity gate with M4 BOOTSTRAP thresholds
price_sanity_enabled: true
price_sanity_max_deviation_bps: 5000  # 50% for bootstrap

# Paper trading
cooldown_seconds: 60
notion_capital_usdc: "10000.000000"

# M5 Cost model (gas-only)
gas_usd_estimate: 0.10

# M4.2 USD-notional sizing (v2.2.3)
paper_size_usd: 250
paper_slippage_bps: 0
target_usd_notional: 250
use_usd_notional: true

# Spread signal threshold
min_spread_bps: 20
min_net_pnl_usdc_est: 0.0

# v2.2.0: truth_mode_m42 - roundtrip is canonical
truth_mode_m42: true
use_quoter_v2: true

# M4 markers - execution disabled
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4

# Quota settings
quota:
  max_requests_per_second: 30
  max_burst: 50
