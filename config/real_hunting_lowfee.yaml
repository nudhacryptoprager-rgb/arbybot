# PATH: config/real_hunting_lowfee.yaml
#
# M4.2 REAL Pipeline - Low-Fee Hunting Config
#
# PURPOSE: Hunt for profitable arb opportunities in LOW-FEE pools (100/500 bps tiers)
# - Economics gate ensures only profitable roundtrips evaluated
# - Cross-DEX only (require_cross_dex=true)
# - Discovery runtime for expanded search surface
# - Priority fee tiers: 100 (0.01%), 500 (0.05%)
#
# ECONOMICS RATIONALE:
# - 30 bps pools: min_required_spread ≈ 71 bps (very hard)
# - 5 bps pools:  min_required_spread ≈ 21 bps (achievable)
# - 1 bps pools:  min_required_spread ≈ 13 bps (best chance)
#
# This config prioritizes low-fee pools where economics are favorable.

# Chain: Arbitrum One
chain: arbitrum_one
chain_id: 42161

# RPC endpoints with fallback
rpc_endpoints:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.public.blastapi.io"
  - "https://rpc.ankr.com/arbitrum"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# 2 DEXes for cross-DEX arbitrage
dexes:
  - uniswap_v3
  - sushiswap_v3

# ========== CONFIG MODE (not discovery_runtime) ==========
# v3.1.0: Discovery runtime uses slot0 which conflicts with truth_mode_m42
# Using config mode with verified cross-DEX pairs instead
# universe_source: config (default - using config pairs)
require_cross_dex: true

# Pairs with verified cross-DEX pools at low fee tiers
# Verified via: py -3.11 -m scripts.verify_v3_pools --require-cross-dex --pairs WETH/USDC WETH/USDT WETH/DAI DAI/USDC USDC/USDT USDE/USDC
pairs:
  - token_in: WETH
    token_out: USDC
    fee_tiers: [100, 500]
  - token_in: WETH
    token_out: USDT
    fee_tiers: [500]
  - token_in: WBTC
    token_out: WETH
    fee_tiers: [500, 3000]  # 3000 fallback (sushi 500 has liq=0)
  - token_in: ARB
    token_out: WETH
    fee_tiers: [500]
  - token_in: LINK
    token_out: WETH
    fee_tiers: [500, 3000]  # 3000 fallback for cross-DEX stability
  - token_in: wstETH
    token_out: WETH
    fee_tiers: [100, 500]
  - token_in: WBTC
    token_out: USDC
    fee_tiers: [500]
  # === USDC/USDT (fee=100) - cross-DEX verified ===
  - token_in: USDC
    token_out: USDT
    fee_tiers: [100]
  # === ARB/USDC (fee=500,3000) - cross-DEX for diversity ===
  - token_in: ARB
    token_out: USDC
    fee_tiers: [500, 3000]  # 3000 fallback for cross-DEX stability

# ========== LOW-FEE POOL PRIORITY ==========
# fee_tiers to query (100 = 0.01%, 500 = 0.05%)
# Excluding 3000 (0.30%) and 10000 (1.00%) which have worse economics
default_fee_tiers:
  - 100
  - 500

# ========== ECONOMICS PARAMETERS ==========
# These are used by execution/economics.py for min_required_spread_bps calculation
paper_size_usd: 100  # Reduced to minimize price impact slippage
gas_usd_estimate: 0.10  # Arbitrum gas is cheap
paper_slippage_bps: 5   # Conservative slippage

# Trade sizing: target USD notional per trade (affects slippage)
# MUST match paper_size_usd for consistent slippage measurement
target_usd_notional: 100  # Equal to paper_size_usd (sizing consistency)
use_usd_notional: true

# Spread threshold: 16 bps ensures gross profit > cost floor (gas+slippage)
# v3.2.2: min_spread_bps must satisfy: spread × size >= gas + slippage
# With size=$100, slippage=5bps ($0.05), gas=$0.10 → cost_floor=$0.15
# 16 bps × $100 = $0.16 > $0.15 → NOT FRAGILE
min_spread_bps: 16

# ========== STANDARD SETTINGS ==========

# Gas config (Arbitrum)
gas_price_gwei: 0.1
max_gas_price_gwei: 1.0
l2_gas_limit: 1000000

# Price sanity
price_sanity_max_deviation_bps: 5000

# M4 simulate_only (no real execution)
kill_switch_active: true
simulate_only: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4

# v2.2.0: truth_mode_m42 - roundtrip is canonical, one-leg is diagnostic only
truth_mode_m42: true

# v2.2.0: use_quoter_v2 enables QuoterV2 calls for executable pricing
use_quoter_v2: true

