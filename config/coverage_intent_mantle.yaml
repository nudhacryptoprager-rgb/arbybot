# PATH: config/coverage_intent_mantle.yaml
#
# M5 COVERAGE Config - Intent-Driven Universe (mantle)
#
# CHAIN QUALITY STATUS (2026-03-10 session 3):
#   Classification: TOP_PAIR_DOMINANCE_WARN (WETH/WMNT 67% > 60%)
#   Evidence: runDir 121135 - 4 signals, 3 included ($7.53)
#     - cmETH/METH 23bps [$0.09], mETH/WETH 252bps [$2.37], WETH/WMNT 522bps [$5.07]
#     - USDC/USDT 2884bps excluded (>750 suspect threshold, clearly stale)
#   Fix (session 3): Add WETH_WMNT anchor for sanity check.
#     Add USDC/USDT to excluded_pair_hints (consistently stale 2884bps).
#     SAME_DEX_PRESENT expected (single DEX agni_v3 only).
#   Target: TOP_PAIR_DOMINANCE_WARN ≤ 0.60 (add more non-WETH/WMNT breadth)
#
# CHAIN STATUS (historical): SIGNAL_PRODUCING via same-DEX fallback
#   - require_cross_dex=false because ALL cross-dex routes trigger MIXED_SOURCE
#   - stratum (ve33) uses getAmountOut, agni_v3 (uniswap_v3) uses quoter_v2
#   - Single-DEX fee-tier arbitrage (agni_v3→agni_v3) is the only viable path
#   - NOT cross-DEX-ready until FusionX V3 or similar quoter_v2 DEX added
#
# PURPOSE:
#   Test intent.txt → discovery_runtime → pool resolution pipeline on Mantle.
#   Uses `universe_source: discovery_runtime` to resolve pairs from intent.txt
#   via factory.getPool() calls instead of hardcoded pool addresses.
#
# RUN_KIND: COVERAGE
#   - Will NOT update rolling artifacts (NORM-only policy)
#   - Safe for testing without affecting production rolling state
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/coverage_intent_mantle.yaml --cycles 1
#
# v3.2.51: require_cross_dex=false (MIXED_SOURCE fix, same-DEX fallback)
# v3.2.19: Initial config for Mantle multi-chain rollout

# Chain: Mantle
chain: mantle
chain_id: 5000

# RPC endpoints with fallback
rpc_endpoints:
  - "https://rpc.mantle.xyz"
  - "https://mantle.public.blastapi.io"

# RPC settings
rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

# Intent-driven universe: resolve pairs from intent.txt
universe_source: discovery_runtime

# DEXes to scan (must have factory addresses in dexes.yaml)
# v3.2.70: Only agni_v3 (quoter_v2-compatible)
# stratum (ve33/getAmountOut) removed — all stratum routes = MIXED_SOURCE rejected,
# no benefit, only adds CRITICAL_REJECT noise to run_summary
dexes:
  - agni_v3

# Discovery settings
discovery_runtime_max_pairs: 20
# v3.2.51: require_cross_dex=false because ALL cross-dex routes are stratum<->agni_v3
# stratum=ve33 (getAmountOut), agni_v3=uniswap_v3 (quoter_v2) = MIXED_SOURCE
# This allows single-DEX fee-tier arbitrage where both legs use same quote source
# RE-ENABLE when: FusionX V3 or another UniV3 DEX added that can route quoter_v2<->quoter_v2
require_cross_dex: false  # BLOCKED_BY: MIXED_SOURCE stratum<->agni_v3

# Quoter V2 for executable quotes (agni_v3 has quoter_v2)
use_quoter_v2: true

# Multicall batching (default ON)
use_multicall: true

# USD-notional sizing (M4.2)
use_usd_notional: true
target_usd_notional: 100.0

# Spread economics
# v3.2.50: min_spread_bps lowered from 5 to 3 for better signal capture
# Rationale: Mantle gas_usd_estimate=0.02 means 3bps spread is highly profitable
min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.02  # Mantle is very cheap (MNT gas)

# v3.2.72: Relaxed SUSPECT_SPREAD_HARD threshold for Mantle
# Default 500 excludes WETH/WMNT at 543bps (legitimate same-DEX fee-tier arb)
# 750 allows WETH/WMNT while still rejecting USDC/USDT at 2884bps (fake spread)
suspect_spread_bps_hard: 750
suspect_spread_bps: 400

# L1 cost model: Mantle uses EigenDA/modular DA (not Ethereum L1 calldata)
# v3.2.55: Per-txn L1 overhead is minimal
l1_data_gas_units: 0   # EigenDA - no per-txn L1 data posting
l1_gas_price_gwei: 0   # DA costs are off-chain

# Token USD prices (for notional sizing)
# v3.2.52: Removed AUSD (not on DEXes), kept mUSD, PUFF
tokens_usd_price:
  WETH: 2050.0       # on-chain ~2050 (2026-03-10)
  WMNT: 0.80
  USDC: 1.0
  USDT: 1.0
  mUSD: 1.0
  mETH: 2100.0       # ~1.02x WETH
  cmETH: 2100.0      # ~1.02x WETH
  PUFF: 0.001        # Meme token - low value

# Price anchor overrides for sanity checking
tokens_anchor_price:
  METH_WETH: 1.024       # mETH ~1.024x WETH (staked ETH)
  CMETH_METH: 1.0        # cmETH ~1.0x mETH (wrapper)
  WETH_USDC: 2050.0      # aligned with tokens_usd_price
  WETH_WMNT: 2562.5      # Session 3: 2050/0.80 — helps PRICE_SANITY on WMNT pools
  USDC_USDT: 1.0         # stablecoin peg

# Price sanity gates (relaxed for bootstrap)
price_sanity_max_deviation_bps: 10000

# Drift tolerance (relaxed for bootstrap)
drift_warning_pct: 30.0

# Session 3: Exclude consistently stale pairs
excluded_pair_hints:
  - "USDC/USDT"    # 2884bps consistently — stale/bad quote on agni_v3
  - "PUFF/*"       # Meme token, thin liquidity

# R17: Dynamic sweep for measured economics frontier (all-chain)
dynamic_probe:
  enabled: true
  sizes_usd: [25, 50, 75, 100]
  top_routes: 2

# Run kind: COVERAGE (won't update rolling)
run_kind: COVERAGE

# M4.2 Truth-Semantics (MANDATORY for profit interpretation)
# v3.2.20: Full M4.2 semantics for contractual uniformity
truth_mode_m42: true
execution_enabled: false
execution_block_reason: EXECUTION_DISABLED_M4_COVERAGE
kill_switch_active: true
simulate_only: true
