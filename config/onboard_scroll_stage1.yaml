# PATH: config/onboard_scroll_stage1.yaml
#
# ONBOARDING: scroll -> STAGE 1 (Sushi + Nuri + official Uniswap V3)
#
# STATUS: structural-debug / bring-up config. Do not treat this as production truth.
# R28.27: Added excluded_pair_hints for SCR/STONE (persistent LIQUIDITY_ZERO, dead pools).
#
# STRUCTURAL REALITY:
#   - Scroll has surface, but dead or mispriced pools still dominate truthful gating
#   - Official Scroll docs list SushiSwap, Nuri, Uniswap V3, SyncSwap and iZUMi
#   - We only enable DEXes that map to currently supported adapter families
#   - Before running: clear quarantine with:
#       Remove-Item data\cache\quarantine_state_scroll.json
#
# ADAPTER READINESS:
#   uniswap_v3 -> UniswapV3Adapter: official Scroll deployment, newly enabled
#   nuri_v3 -> UniswapV3Adapter: verified
#   sushiswap_v3 -> UniswapV3Adapter: production
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_scroll_stage1.yaml --cycles 1

chain: scroll
chain_id: 534352

run_kind: COVERAGE

rpc_endpoints:
  - "https://rpc.scroll.io"
  - "https://scroll.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

# R36: +syncswap +iziswap — adapters implemented, dexes.yaml entries present for scroll
dexes:
  - uniswap_v3
  - sushiswap_v3
  - nuri_v3
  - syncswap
  - iziswap

discovery_runtime_max_pairs: 30
require_cross_dex: true

# R28.27: Exclude known-dead/zero-liquidity pairs on scroll
# SCR/* and STONE/* have persistent LIQUIDITY_ZERO, waste quote budget
excluded_pair_hints:
  - "SCR/*"
  - "*/SCR"
  - "STONE/*"
  - "*/STONE"

# R28.25: Roundtrip evaluation caps (aligned with primary)
roundtrip_max_candidates: 50
roundtrip_top_n: 15

use_multicall: true
use_quoter_v2: true

# R28.25: Aligned with primary economics contract (was 100/3)
# R30: discovery_probe_size_usd decouples discovery from execution sizing
use_usd_notional: true
discovery_probe_size_usd: 10
target_usd_notional: 150.0

min_spread_bps: 5
paper_size_usd: 150
paper_slippage_bps: 5
gas_usd_estimate: 0.05

# R29: Wide size frontier (fixed-size doctrine removed)
dynamic_probe:
  enabled: true
  sizes_usd: [1, 2.5, 5, 10, 15, 25, 50, 75, 100, 150, 250, 500, 750, 1000, 1500, 2500, 5000, 7500, 10000]
  top_routes: 15

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

quoter_max_gas_estimate: 3000000
quoter_max_ticks_crossed: 15
suspect_spread_bps_hard: 500
suspect_spread_bps: 400

price_sanity_max_deviation_bps: 5000

l1_data_gas_units: 0
l1_gas_price_gwei: 0

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDT: 1.0
  DAI: 1.0
  wstETH: 2500.0
  SCR: 0.50
  STONE: 2100.0
  weETH: 2100.0

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WETH_WBTC: 0.030
  WBTC_USDC: 68000.0
  USDC_USDT: 1.0
  USDC_DAI: 1.0
