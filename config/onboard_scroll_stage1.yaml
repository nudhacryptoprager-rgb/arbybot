# PATH: config/onboard_scroll_stage1.yaml
#
# ONBOARDING: scroll → STAGE 1 (nuri_v3 + sushiswap_v3 cross-DEX test)
#
# STATUS: STRUCTURAL_DEBUG / bring-up config. DO NOT use for production truth.
#
# R28.20 STRUCTURAL REALITY:
#   - Surface is adequate: 9/13 cross-DEX pairs
#   - But ALL pools dead/broken: WBTC/USDC price=7330 (expected 68000),
#     WETH/USDC@sushiswap nearly empty, USDC/DAI@sushiswap dead (0.056 DAI per 100 USDC)
#   - Surviving signal is mixed-source (buy=quoter_v2, sell=slot0) with
#     SUSPECT_SPREAD_EXCLUDED + SLOT0_DIAGNOSTIC + MIXED_SOURCE_DIAGNOSTIC
#   - actionable_signals_count=0 after R28.20 (diagnostic signals excluded from count)
#   - This config is for BRING-UP ONLY — production stage2 requires healthy real-quote routes
#   - Before running: clear quarantine with:
#       Remove-Item data\cache\quarantine_state_scroll.json
#
# R27 fix: nuri_v3 re-classified as uniswap_v3/quoter_v2 (per dexes.yaml trust anchor).
#
# ADAPTER READINESS:
#   nuri_v3 → UniswapV3Adapter: VERIFIED R27.1
#   sushiswap_v3 → UniswapV3Adapter: PRODUCTION
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_scroll_stage1.yaml --cycles 1

chain: scroll
chain_id: 534352

run_kind: COVERAGE

rpc_endpoints:
  - "https://rpc.scroll.io"
  - "https://scroll.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

# Both DEXes — cross-DEX test (nuri_v3 re-enabled R27)
dexes:
  - sushiswap_v3
  - nuri_v3

discovery_runtime_max_pairs: 20
require_cross_dex: true

use_multicall: true
use_quoter_v2: true

use_usd_notional: true
target_usd_notional: 100.0

min_spread_bps: 3
paper_size_usd: 100
paper_slippage_bps: 5
gas_usd_estimate: 0.05

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

# Production-like thresholds (R28.18: tightened from debug)
quoter_max_gas_estimate: 3000000
quoter_max_ticks_crossed: 15
suspect_spread_bps_hard: 500
suspect_spread_bps: 400

price_sanity_max_deviation_bps: 5000

l1_data_gas_units: 0
l1_gas_price_gwei: 0

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDT: 1.0
  wstETH: 2500.0
  SCR: 0.50
  STONE: 2100.0
  weETH: 2100.0

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDT: 2050.0
  WETH_WBTC: 0.030
  WBTC_USDC: 68000.0
  USDC_USDT: 1.0
  USDC_DAI: 1.0
