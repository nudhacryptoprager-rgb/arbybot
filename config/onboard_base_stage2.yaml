# PATH: config/onboard_base_stage2.yaml
#
# ONBOARDING: base → STAGE 2 (includes aerodrome ve33)
#
# STATUS: 4 executable DEXes (uniswap_v3, sushiswap_v3, pancakeswap_v3, aerodrome).
# aerodrome (ve33) adapter IMPLEMENTED (R27.4). This config adds it to the scan surface.
#
# ADAPTER READINESS:
#   uniswap_v3 → UniswapV3Adapter: PRODUCTION
#   sushiswap_v3 → UniswapV3Adapter: PRODUCTION
#   pancakeswap_v3 → UniswapV3Adapter: PRODUCTION
#   aerodrome → Ve33Adapter: PRODUCTION (R27.4)
#
# PURPOSE: Test ve33 cross-DEX surface on base. Evaluate aerodrome pair quality.
# RUN_KIND: COVERAGE
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_base_stage2.yaml --cycles 1

chain: base
chain_id: 8453

run_kind: COVERAGE

rpc_endpoints:
  - "https://mainnet.base.org"
  - "https://base.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

# 4 DEXes: stage1 set + aerodrome (ve33)
# R28.24: aerodrome EXCLUDED — VE33_QUOTE_FAILED=29 dominant blocker preventing cross-DEX.
# RESTORE WHEN: Ve33Adapter getAmountOut() returns non-zero for base pairs.
dexes:
  - uniswap_v3
  - sushiswap_v3
  - pancakeswap_v3
  # - aerodrome  # R28.24: DISABLED — VE33_QUOTE_FAILED blocks all cross-DEX on base

discovery_runtime_max_pairs: 30
require_cross_dex: true

# R28.25: Roundtrip evaluation caps (aligned with primary)
roundtrip_max_candidates: 50
roundtrip_top_n: 15

use_multicall: true
use_quoter_v2: true

# R28.25: Aligned with primary economics contract (was 100/3)
use_usd_notional: true
target_usd_notional: 150.0

min_spread_bps: 5
paper_size_usd: 150
paper_slippage_bps: 5
gas_usd_estimate: 0.05

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  USDC: 1.0
  USDbC: 1.0
  USDT: 1.0
  cbETH: 2200.0
  wstETH: 2500.0
  AERO: 0.50
  DAI: 1.0
  # R28.22: Fix NO_USD_PRICE rejects for base meme/defi pairs
  cbBTC: 68000.0
  BRETT: 0.05
  DEGEN: 0.005
  TOSHI: 0.0003
  rETH: 2400.0
  # R28.23: on-chain medians from fresh base quote artifacts
  VIRTUAL: 0.68
  WELL: 0.0045

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDbC: 2050.0
  WBTC_WETH: 33.0
  cbETH_WETH: 1.07
  wstETH_WETH: 1.22
