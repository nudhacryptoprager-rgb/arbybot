# PATH: config/onboard_base_stage2.yaml
#
# ONBOARDING: base → STAGE 2 (includes aerodrome ve33)
#
# STATUS: 4 executable DEXes (uniswap_v3, sushiswap_v3, pancakeswap_v3, aerodrome).
# aerodrome (ve33) adapter IMPLEMENTED (R27.4). This config adds it to the scan surface.
# R28.27: aerodrome still excluded (VE33_QUOTE_FAILED). Added excluded_pair_hints for
# LIQUIDITY_ZERO meme pairs (BRETT, DEGEN, TOSHI) that waste quote budget.
# Ve33 diagnostic logging improved (VE33_QUOTE_DIAG at INFO level).
#
# ADAPTER READINESS:
#   uniswap_v3 → UniswapV3Adapter: PRODUCTION
#   sushiswap_v3 → UniswapV3Adapter: PRODUCTION
#   pancakeswap_v3 → UniswapV3Adapter: PRODUCTION
#   aerodrome → Ve33Adapter: PRODUCTION (R27.4)
#
# PURPOSE: Test ve33 cross-DEX surface on base. Evaluate aerodrome pair quality.
# RUN_KIND: COVERAGE
#
# WORKFLOW:
#   py -3.11 scripts/ci_m5_0_gate.py --online --config config/onboard_base_stage2.yaml --cycles 1

chain: base
chain_id: 8453

run_kind: COVERAGE

rpc_endpoints:
  - "https://mainnet.base.org"
  - "https://base.public.blastapi.io"

rpc_timeout_seconds: 10
rpc_retries: 3
rpc_backoff_base_ms: 500

universe_source: discovery_runtime

# 4 DEXes: stage1 set + aerodrome (ve33)
# R28.24: aerodrome was excluded (VE33_QUOTE_FAILED=29). Diagnosed: pools+ABI work,
# original failure was transient RPC issue. Verified: getAmountOut returns valid quotes
# for WETH/USDC, AERO/USDC, AERO/WETH on both volatile and stable pools.
# R39g+: Re-enabled.
dexes:
  - uniswap_v3
  - sushiswap_v3
  - pancakeswap_v3
  - aerodrome

discovery_runtime_max_pairs: 30
require_cross_dex: true

# R28.27: Exclude known-dead/stale pairs on base
# LIQUIDITY_ZERO dominant: 41 pools persistently zero → waste quote budget
excluded_pair_hints:
  - "BRETT/*"
  - "DEGEN/*"
  - "TOSHI/*"
  - "*/BRETT"
  - "*/DEGEN"
  - "*/TOSHI"

# R28.25: Roundtrip evaluation caps (aligned with primary)
roundtrip_max_candidates: 50
roundtrip_top_n: 15

use_multicall: true
use_quoter_v2: true

# R28.25: Aligned with primary economics contract (was 100/3)
# R30: discovery_probe_size_usd decouples discovery from execution sizing
use_usd_notional: true
discovery_probe_size_usd: 10
target_usd_notional: 150.0

min_spread_bps: 5
paper_size_usd: 150
paper_slippage_bps: 5
gas_usd_estimate: 0.05

# R29: Wide size frontier (fixed-size doctrine removed)
dynamic_probe:
  enabled: true
  sizes_usd: [1, 2.5, 5, 10, 15, 25, 50, 75, 100, 150, 250, 500, 750, 1000, 1500, 2500, 5000, 7500, 10000]
  top_routes: 15

truth_mode_m42: true
execution_enabled: false
execution_block_reason: "EXECUTION_DISABLED_M4"
kill_switch_active: true
simulate_only: true

price_sanity_max_deviation_bps: 5000

tokens_usd_price:
  WETH: 2050.0
  WBTC: 68000.0
  cbBTC: 68000.0
  USDC: 1.0
  USDbC: 1.0
  USDT: 1.0
  DAI: 1.0
  cbETH: 2200.0
  AERO: 0.50
  VIRTUAL: 1.50

tokens_anchor_price:
  cbBTC_USDC: 68000.0
  cbBTC_WETH: 33.0
  AERO_USDC: 0.50
  WETH_USDC: 2050.0
  wstETH: 2500.0
  AERO: 0.50
  DAI: 1.0
  # R28.22: Fix NO_USD_PRICE rejects for base meme/defi pairs
  cbBTC: 68000.0
  BRETT: 0.05
  DEGEN: 0.005
  TOSHI: 0.0003
  rETH: 2400.0
  # R28.23: on-chain medians from fresh base quote artifacts
  VIRTUAL: 0.68
  WELL: 0.0045

tokens_anchor_price:
  WETH_USDC: 2050.0
  WETH_USDbC: 2050.0
  WBTC_WETH: 33.0
  USDC_USDT: 1.0
  USDC_DAI: 1.0
  cbETH_WETH: 1.07
  wstETH_WETH: 1.22
