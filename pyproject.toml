# PATH: pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arby"
version = "0.3.0"
description = "Cryptocurrency Arbitrage Bot"
readme = "README.md"
# STEP 1: Pin Python 3.11.x permanently
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
    "web3>=6.0.0",
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "websocket-client>=1.6.0",  # v2.2.0: WS support for block feed
]

[tool.setuptools.packages.find]
include = [
    "core",
    "strategy",
    "strategy.*",
    "monitoring",
    "execution",
    "execution.*",
    "engine",
    "dex",
    "dex.*",
    "cex",
    "cex.*",
    "chains",
    "discovery",
    "config",
    "tests",
    "tests.*",
    "m4",
    "m7",
    "m7.*",
    "m8",
    "m8.*",
    "m8_1",
    "m8_1.*",
    "m9",
    "m9.*",
    "state",
    "state.*",
    "application",
    "application.*",
    "api",
    "api.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    # Build backend for deterministic wheel-smoke
    # (tests/unit/test_packaging_contract.py::TestWheelShipsAllActivePackages).
    "setuptools>=61.0",
    "wheel>=0.40.0",
]
postgres = [
    # Optional production driver for state.postgres.PostgresStateRepository.
    # Imported lazily; offline CI never requires it.
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Note: For offline mode, set ARBY_OFFLINE=1 before running tests
# Removed env= option as it requires pytest-env plugin

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
